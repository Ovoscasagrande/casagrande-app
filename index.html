    return `<div class="sec" style="${prox&&prox.id===e.id?'border-left:3px solid var(--acc)':''}">
      <b>${e.ordem}. ${esc(c.nome||'—')}</b> <span class="tag ${st[0]}">${st[1]}</span>
      <p class="hint">${esc(c.endereco||'—')}${c.cidade?' · '+esc(c.cidade)+(c.uf?'/'+esc(c.uf):''):''}</p>
      <p class="hint">NF ${esc(nf.numero||'—')}${(e.nfs_extra||[]).length?' +'+e.nfs_extra.length+' NF':''} · vendedor ${esc(nf.vendedor||'—')}${nf.comprador?' · comprador '+esc(nf.comprador):''}</p>
      ${c.telefone?`<p class="hint">📞 ${esc(c.telefone)}</p>`:''}
      ${mapa?`<p style="margin:6px 0">${mapa}</p>`:''}
      ${e.motivo?`<p class="hint" style="color:var(--bad)">Motivo: ${esc(e.motivo)}</p>`:''}
      ${e.status==='entregue'&&e.foto_path?`<div id="mr-foto-${e.id}">${empty('comprovante…')}</div>`:''}
      ${acao?`<div style="margin-top:8px">${acao}</div>`:''}</div>`;
  };
  html+=prox?card(prox):'';
  html+=`<div class="sec"><h3>Demais paradas</h3>`+((ents||[]).filter(e=>!prox||e.id!==prox.id).map(card).join('')||empty(''))+`</div>`;
  w.innerHTML=html;
  const re=()=>PAGES['minha-rota'](el);
  w.querySelectorAll('[data-chega]').forEach(b=>b.onclick=async()=>{
    if(!navigator.onLine){filaAdd({tipo:'upd',table:'entregas',id:b.dataset.chega,row:{status:'andamento',chegada_em:new Date().toISOString()}});re();return}
    await upd('entregas',b.dataset.chega,{status:'andamento',chegada_em:new Date().toISOString()});re();
  });
  w.querySelectorAll('[data-nao]').forEach(b=>b.onclick=async()=>{
    pedirTexto('Não realizada','Qual o motivo?',async v=>{
      if(!navigator.onLine){filaAdd({tipo:'upd',table:'entregas',id:b.dataset.nao,row:{status:'nao_realizada',motivo:v['pt-val']}});re();return}
      await upd('entregas',b.dataset.nao,{status:'nao_realizada',motivo:v['pt-val']});re();
    });
  });
  w.querySelectorAll('[data-ent]').forEach(b=>b.onclick=()=>{
    const e=(ents||[]).find(x=>x.id===b.dataset.ent);
    openModal('Entrega — '+(e.clientes_dist?.nome||''),[],null);
    const wv=document.getElementById('modal');
    wv.innerHTML=`<h3>Entrega — ${esc(e.clientes_dist?.nome||'')}</h3>`+blocoFoto('en-foto','Comprovante')+
      `<div class="mrow"><button class="btn sec" id="en-cancel">Cancelar</button><button class="btn" id="en-ok">✅ Confirmar entrega</button></div>`;
    $('en-cancel').onclick=()=>document.getElementById('modal-wrap').classList.remove('open');
    const getF=bindFoto('en-foto');
    $('en-ok').onclick=async()=>{
      const f=getF();
      if(!f){toast('A foto do comprovante é obrigatória');return}
      const path=ME.id+'/entrega-'+e.id+'.jpg';
      const saved=await uploadFoto(f,path);
      if(!saved)return;
      const row={status:'entregue',entregue_em:new Date().toISOString(),foto_path:saved};
      if(!navigator.onLine){filaAdd({tipo:'upd',table:'entregas',id:e.id,row});document.getElementById('modal-wrap').classList.remove('open');re();return}
      await upd('entregas',e.id,row);
      document.getElementById('modal-wrap').classList.remove('open');re();
    };
  });
  for(const e of (ents||[]).filter(x=>x.status==='entregue'&&x.foto_path)){const d=$('mr-foto-'+e.id);if(d)d.innerHTML=await fotoHtml(e.foto_path)}
};

/* ============ notificações ============ */
PAGES.notif=async el=>{
  el.innerHTML=`<h1 class="pg">Notificações</h1><div id="nt">${empty('Carregando…')}</div>`;
  const {data:lista}=await sb.from('notificacoes').select('*').eq('usuario_id',ME.id).order('criado_em',{ascending:false}).limit(50);
  const l=$('nt');
  if(!lista||!lista.length){l.innerHTML=empty('Nada por aqui');return}
  l.innerHTML=lista.map(n=>{
    const podeIr=n.link&&NAV.includes(n.link);
    return `<div class="sec" data-go="${podeIr?esc(n.link):''}" style="padding:12px 16px;${podeIr?'cursor:pointer;border-left:3px solid var(--acc)':''}">
      <b style="font-size:14px">${esc(n.titulo)}</b><p class="hint">${esc(n.corpo||'')}</p>
      <p style="font-size:11px;color:#666">${fmtDT(n.criado_em)}${podeIr?' · <span style="color:var(--acc)">toque para abrir →</span>':''}</p></div>`}).join('');
  l.querySelectorAll('[data-go]').forEach(d=>{if(d.dataset.go)d.onclick=()=>go(d.dataset.go)});
  await sb.from('notificacoes').update({lida:true}).eq('usuario_id',ME.id).eq('lida',false);
  $('bdg').classList.add('hide');
};
</script>
</body>
