<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>CASAGRANDE</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#141414">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#141414;--card:#1e1e1e;--field:#2a2a2a;--ink:#f5f5f5;--mut:#9a9a9a;--acc:#fcc85c;--ok:#4caf50;--bad:#e05252}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;min-height:100dvh}
#app{max-width:1100px;margin:0 auto}
.hide{display:none!important}
/* ---------- login ---------- */
#login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#login img.logo{width:min(320px,78vw);margin-bottom:36px}
.card{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:380px}
.card h2{font-size:17px;margin-bottom:16px;color:var(--ink)}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}
input,select,textarea{width:100%;background:var(--field);border:1px solid #3a3a3a;border-radius:10px;padding:12px;font-size:15px;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:70px}
button{font-family:inherit;cursor:pointer}
.btn{width:100%;background:var(--acc);color:#141414;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;margin-top:18px}
.btn.sec{background:var(--field);color:var(--ink);font-weight:600}
.btn.mini{width:auto;padding:8px 14px;font-size:13px;margin-top:0;border-radius:9px}
.btn:disabled{opacity:.5}
.msg{font-size:13px;margin-top:10px;min-height:16px}
.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
/* ---------- shell ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(20,20,20,.94);backdrop-filter:blur(8px);padding:12px 16px;display:flex;align-items:center;gap:12px;padding-top:calc(12px + env(safe-area-inset-top))}
header img{height:30px}
header .tt{font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{background:none;border:none;color:var(--ink);font-size:22px;line-height:1;padding:4px 8px}
.bell{position:relative;background:none;border:none;font-size:20px;color:var(--ink)}
.bell .bdg{position:absolute;top:-4px;right:-6px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px}
nav{position:fixed;top:0;left:-260px;width:250px;height:100vh;height:100dvh;background:#101010;z-index:40;transition:left .25s;padding:calc(16px + env(safe-area-inset-top)) 12px 16px;overflow-y:auto}
nav.open{left:0}
nav .who{font-size:13px;color:var(--mut);padding:8px 10px 14px;border-bottom:1px solid #262626;margin-bottom:8px}
nav button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:11px 12px;border-radius:10px;font-size:14px}
nav button.on{background:#262626;color:var(--acc)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
main{padding:16px;padding-bottom:80px}
h1.pg{font-size:19px;margin-bottom:14px}
/* ---------- componentes ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border-radius:16px;padding:18px 14px;text-align:center;font-size:14px;font-weight:600;border:none;color:var(--ink);display:flex;flex-direction:column;gap:8px;align-items:center}
.tile .em{font-size:28px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:14px;padding:14px}
.kpi .v{font-size:22px;font-weight:800;color:var(--acc)}
.kpi .l{font-size:11px;color:var(--mut);margin-top:3px}
.tblwrap{overflow-x:auto;background:var(--card);border-radius:14px;padding:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid #2c2c2c;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #242424;vertical-align:top}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
#modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
#modal-wrap.open{display:flex}
#modal{background:var(--card,#1e1e1e);border:1px solid #333;border-radius:14px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;padding:18px}
#modal h3{margin:0 0 12px;font-size:16px}
#modal label{font-size:11px;color:var(--mut);margin:10px 0 4px;display:block}
#modal input,#modal select,#modal textarea{width:100%;background:var(--field);color:var(--ink);border:1px solid #333;border-radius:8px;padding:9px 10px;font-size:13px}
#modal .mrow{display:flex;gap:8px;margin-top:14px}
#modal .mrow .btn{flex:1}
.tag.aberta{background:#3a2f14;color:var(--acc)}
.tag.conferencia{background:#14304a;color:#7db8e8}
.tag.fechada{background:#1c3320;color:#7fd88f}
.tag.aguardando,.tag.recebida,.tag.recebido,.tag.aguardando_ciencia{background:#3a2f14;color:var(--acc)}
.tag.aprovada,.tag.fechada,.tag.resolvida,.tag.concluida{background:#1c3320;color:#7fd88f}
.tag.reprovada{background:#3a1a1a;color:#e88}
.tag.em_analise,.tag.em_execucao,.tag.encaminhado,.tag.ciente,.tag.providencia{background:#14304a;color:#7db8e8}
.tag.aguardando_peca{background:#3a2f14;color:var(--acc)}
.tag.arquivado{background:#2a2a2a;color:#888}
.row{display:flex;gap:10px}
.row>*{flex:1}
.sec{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
.sec h3{font-size:14px;margin-bottom:10px}
.sec .hint{font-size:12px;color:var(--mut)}
.wm{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:0;opacity:.06}
.wm img{width:min(72vw,600px);filter:brightness(10)}
main>*{position:relative;z-index:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#2e2e2e;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw}
#toast.on{opacity:1}
.empty{color:var(--mut);font-size:13px;padding:18px;text-align:center}
.photo{max-width:140px;border-radius:10px;display:block;margin-top:6px}
.cfitem{border:1px solid #2c2c2c;border-radius:12px;padding:12px;margin:8px 0}
.cfitem.ok{border-color:#2e5c34;background:#1a241b}
.cfitem.no{border-color:#5c3a2e;background:#241d1a}
@media(min-width:700px){nav{position:fixed;left:0;width:230px}#scrim{display:none}main{margin-left:230px}header{margin-left:230px}}

:root{--acc-ovos:#fcc85c;--acc-transp:#1e5aa8}
.emp-btn{display:inline-flex;align-items:center;gap:6px;background:var(--field);border:1px solid #333;color:var(--ink);border-radius:18px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.emp-btn span{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dbtabs{display:flex;gap:6px;margin:2px 0 10px;overflow-x:auto}
.dbtabs button{flex:1;min-width:104px;background:var(--field);border:1px solid #333;color:var(--mut);border-radius:10px;padding:9px 6px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.dbtabs button.on{background:var(--acc);color:#111;border-color:var(--acc)}
.emp-menu{position:absolute;top:54px;right:10px;background:var(--card);border:1px solid #333;border-radius:12px;padding:6px;display:none;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.55);min-width:220px}
.emp-menu.open{display:block}
.emp-menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:10px 12px;border-radius:8px;font-size:13px;cursor:pointer}
.emp-menu button.on{background:var(--field);color:var(--acc);font-weight:700}
header{position:relative}
body[data-emp="TRANSPORTADORA"]{--acc:#1e5aa8}
.logo-emp{max-width:150px;max-height:56px;object-fit:contain}
.empbar{height:3px;width:100%;background:var(--acc)}
.empchip{display:inline-flex;align-items:center;gap:6px;background:var(--field);border:1px solid #333;border-radius:20px;padding:3px 10px;font-size:11px;color:var(--mut)}
.empchip b{color:var(--acc);font-size:11px}
.seletor{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.seletor button{background:var(--field);color:var(--mut);border:1px solid #333;border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer}
.seletor button.on{background:var(--acc);color:#141414;border-color:var(--acc);font-weight:700}
.campx{margin-top:6px}
.mini-sel{background:var(--field);color:var(--ink);border:1px solid #333;border-radius:8px;padding:7px 8px;font-size:12px}
.dynrow{display:flex;gap:8px;align-items:center;margin-top:6px}
.dynrow input{flex:1}
.dynrow button{margin-top:0}
</style>
</head>
<body>
<div class="wm"><img id="lg-wm" src="logo-branca.png" alt=""></div>
<div id="login">
  <img class="logo" id="lg-login" src="logo-branca.png" alt="CASAGRANDE">
  <div class="card" id="card-login">
    <h2 id="lg-app">CASAGRANDE</h2>
    <label>Usuário</label>
    <input id="li-email" type="email" placeholder="email@casagrande" autocomplete="username">
    <label>Senha</label>
    <input id="li-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="li-btn">Entrar</button>
    <div class="msg" id="li-msg"></div>
    <div class="hint" style="font-size:11px;color:var(--mut);margin-top:8px">Conta nova passa pela aprovação da gerência</div>
    <button class="btn sec" id="li-esqueci" style="margin-top:10px">🔑 Esqueci minha senha</button>
    <button class="btn sec" id="li-cfg" style="margin-top:10px">⚙️ Configurar conexão</button>
    <div class="msg" id="cfg-msg"></div>
    <button class="btn sec" id="li-criar" style="margin-top:10px">➕ Criar conta (equipe)</button>
  </div>
  <div class="card hide" id="card-criar">
    <h2>Criar conta</h2>
    <label>Seu nome</label><input id="cr-nome" placeholder="nome completo">
    <label>Email</label><input id="cr-email" type="email" autocomplete="username">
    <label>Senha (mín. 6)</label><input id="cr-pass" type="password" autocomplete="new-password">
    <label>CPF</label><input id="cr-cpf" inputmode="numeric" placeholder="000.000.000-00">
    <label>CNH</label><input id="cr-cnh" inputmode="numeric" placeholder="nº da CNH">
    <div class="row"><div><label>Categoria</label><input id="cr-cat" placeholder="D / E"></div><div><label>Validade da CNH</label><input id="cr-val" type="date"></div></div>
    <label>Contato (WhatsApp)</label><input id="cr-cont" inputmode="tel" placeholder="(19) 99999-9999">
    <p class="hint" style="margin:6px 0 0">A gerência confere esses dados na hora de liberar seu acesso.</p>
    <button class="btn" id="cr-btn">Criar minha conta</button>
    <div class="msg" id="cr-msg"></div>
    <button class="btn sec" id="cr-voltar" style="margin-top:10px">← Voltar para o login</button>
  </div>
  <div class="card hide" id="card-redef">
    <h2>Nova senha</h2>
    <label>Nova senha (mín. 6)</label><input id="rd-p1" type="password" autocomplete="new-password">
    <label>Confirmar nova senha</label><input id="rd-p2" type="password" autocomplete="new-password">
    <button class="btn" id="rd-btn">Salvar nova senha</button>
    <div class="msg" id="rd-msg"></div>
    <button class="btn sec" id="rd-voltar" style="margin-top:10px">← Voltar para o login</button>
  </div>
</div>
<div id="modal-wrap"><div id="modal"></div></div>
<div id="app" class="hide">
  <header>
    <button class="burger" id="burger">☰</button>
    <img id="lg-head" src="logo-branca.png" alt="">
    <div class="tt" id="pg-title">Início</div>
    <button class="emp-btn" id="emp-btn" style="margin-right:6px"></button>
    <button class="bell" id="bell">🔔<span class="bdg hide" id="bdg">0</span></button>
  </header>
  <div class="emp-menu" id="emp-menu"></div>
  <div id="scrim" class="hide"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>

function empAtiva(){return window.__EMP||'OVOS'}
function setEmp(e){
  window.__EMP=e;applyBranding();buildNav();applyEmpBtn();bindEmpMenu();
  if(!NAV.includes(PAGE)){go('home');toast('Você está em '+(EMPNOME[e]||'GRUPO'))}
  else{go(PAGE)}
}
function applyBranding(){
  const e=empAtiva();
  document.body.dataset.emp=e;

async function comprimir(file){
  if(!file.type.startsWith('image/'))return file;
  try{
    const bmp=await createImageBitmap(file);
    const max=1200;let{width:w,height:h}=bmp;
    if(w>max||h>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(bmp,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.7));
    return blob&&blob.size<file.size?new File([blob],(file.name||'foto.jpg').replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'}):file;
  }catch(e){return file}
}

      const v=$('j-veic').value,kmv=parseFloat($('j-km').value);
      if(!kmv&&kmv!==0){$('j-msg').className='msg err';$('j-msg').textContent='Informe a km inicial';return}
      $('j-msg').className='msg';$('j-msg').textContent='Verificando cronograma…';
      const {data:chk}=await sb.rpc('checar_jornada',{p_veiculo:v});
      if(chk&&chk!=='OK'){$('j-msg').className='msg err';$('j-msg').textContent=chk;return}
      let rot=0;
      if(empAtiva()==='OVOS'){rot=parseInt($('j-rot').value);
        if(!rot){$('j-msg').className='msg err';$('j-msg').textContent='Informe o número do roteiro (vem do ERP)';return}}
      const r=await ins('jornadas',insEmp({motorista_id:ME.motorista.id,veiculo_id:v,roteiro:rot,km_inicial:kmv}));
      if(r){toast('Jornada iniciada! CRLV-e liberado em Multas e documentos');go('jornada')}
    };
  }else{
    w.innerHTML=`<div class="sec"><h3>Jornada aberta — ${esc(aberta.veiculos?.placa||'')}${aberta.roteiro?` · Roteiro ${aberta.roteiro}`:''}</h3>
      <p class="hint">Início: ${fmtDT(aberta.inicio)} · Km inicial: ${km(aberta.km_inicial)}</p>
      <label>Quilometragem final</label><input id="j-kmf" type="number" inputmode="numeric" placeholder="km na chegada">
      <label>Ocorrências (opcional)</label><textarea id="j-oc" placeholder="algo aconteceu no trajeto?"></textarea>
      <button class="btn" id="j-fechar">🏁 Finalizar jornada</button><div class="msg" id="j-msg2"></div></div>`;
    $('j-fechar').onclick=async()=>{
      const kmf=parseFloat($('j-kmf').value);
      if(!kmf&&kmf!==0){$('j-msg2').className='msg err';$('j-msg2').textContent='Informe a km final';return}
      if(kmf<aberta.km_inicial){$('j-msg2').className='msg err';$('j-msg2').textContent='Km final não pode ser menor que a inicial ('+km(aberta.km_inicial)+')';return}
      const r=await upd('jornadas',aberta.id,{km_final:kmf,fim:new Date().toISOString(),ocorrencias:$('j-oc').value||null,status:'conferencia'});
      if(r){toast('Jornada enviada para conferência');go('jornada')}
    };
  }
};

const CONF_ITENS=['Motorista retornou?','Roteiro informado corretamente?','Todas as notas/canhotos entregues?','Comprovantes anexados?','Divergência ou ocorrência?'];

async function pagConfDetalhe(el,jid){
  el.innerHTML=`<h1 class="pg">Conferência</h1><div id="cfd">${empty('Carregando…')}</div>`;
  const d=$('cfd');
  const {data:j}=await sb.from('jornadas').select('*, veiculos(placa,modelo), motoristas(nome)').eq('id',jid).maybeSingle();
  if(!j){d.innerHTML=empty('Jornada não encontrada');return}
  const {data:checks}=await sb.from('jornada_conferencia').select('*').eq('jornada_id',jid);
  const estado={};(checks||[]).forEach(x=>estado[x.item]={ok:x.ok,obs:x.obs||''});
  const [abs,dsp]=await Promise.all([
    sb.from('abastecimentos').select('posto,litros,valor_total,foto_path').eq('jornada_id',jid),
    sb.from('despesas').select('categoria,valor,foto_path').eq('jornada_id',jid)
  ]);
  const comps=[
    ...(abs.data||[]).map(a=>({t:'⛽ Abastecimento — '+(a.posto||'posto'),s:`${a.litros} L · ${fmtBRL(a.valor_total)}`,p:a.foto_path})),
    ...(dsp.data||[]).map(x=>({t:'💰 '+x.categoria,s:fmtBRL(x.valor),p:x.foto_path}))
  ];
  const kmP=j.km_final!=null?Math.round(Number(j.km_final)-Number(j.km_inicial)):null;
  d.innerHTML=`
  <button class="btn sec" id="cf-voltar" style="margin-top:0">← Voltar para a lista</button>
  <div class="sec" style="margin-top:12px">
    <b style="font-size:16px">${esc(j.motoristas?.nome)}</b>
    <div class="hint">${esc(j.veiculos?.placa)} — ${esc(j.veiculos?.modelo||'')} · Roteiro nº ${j.roteiro}</div>
    <div class="row" style="margin-top:10px;font-size:13px"><div>📅 Saída<br>${fmtDT(j.inicio)}</div><div>🏁 Chegada<br>${fmtDT(j.fim)}</div></div>
    <div class="row" style="margin-top:8px;font-size:13px"><div>🛣️ Km<br>${km(j.km_inicial)} → ${km(j.km_final)}</div><div>📏 Percorridos<br><b style="color:var(--acc)">${kmP!=null?kmP.toLocaleString('pt-BR')+' km':'—'}</b></div></div>
    ${j.ocorrencias?`<div style="margin-top:10px;background:#241d1a;border:1px solid #5c3a2e;border-radius:10px;padding:10px;font-size:13px">⚠️ <b>Ocorrência do motorista:</b><br>${esc(j.ocorrencias)}</div>`:''}
  </div>
  <div class="sec"><h3>Comprovantes da jornada (${comps.length})</h3><div id="cf-comps">${comps.length?'':empty('Nenhum comprovante anexado a esta jornada')}</div></div>
  <div class="sec"><h3>Checklist de conferência</h3><div id="cf-itens"></div>
    <div style="margin-top:12px;font-size:12px;color:var(--mut)" id="cf-prog"></div>
    <button class="btn" id="cf-fechar" style="margin-top:10px">✓ Fechar jornada</button>
    <div class="msg" id="cf-msg"></div>
  </div>`;
  $('cf-voltar').onclick=()=>go('conferencia');
  const cw=$('cf-comps');
  for(const cpt of comps){
    const div=document.createElement('div');
    div.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #242424;font-size:13px';
    div.innerHTML=`<div>${esc(cpt.t)}<div class="hint">${esc(cpt.s)}</div></div>`;
    const btn=document.createElement('button');btn.className='btn mini';btn.textContent='👁 foto';
    btn.onclick=async()=>{const url=await assinar(cpt.p);if(url)window.open(url,'_blank');else toast('Foto não encontrada')};
    div.appendChild(btn);cw.appendChild(div);
  }
  const iw=$('cf-itens');
  const renderItens=()=>{
    iw.innerHTML=CONF_ITENS.map((it,i)=>{
      const st=estado[it]||{};
      const cls=st.ok===true?'cfitem ok':st.ok===false?'cfitem no':'cfitem';
      return `<div class="${cls}" data-i="${i}">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
          <b style="font-size:13px">${i+1}. ${it}</b>
          <div style="display:flex;gap:6px">
            <button class="btn mini" data-ok="${i}" style="margin-top:0">✓</button>
            <button class="btn mini" data-no="${i}" style="margin-top:0">✗</button>
          </div>
        </div>
        ${st.ok===false?`<textarea data-obs="${i}" placeholder="O que está pendente? (salva automático)" style="margin-top:8px">${esc(st.obs||'')}</textarea>`:''}
      </div>`}).join('');
    iw.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{
      const it=CONF_ITENS[b.dataset.ok];
      const {error}=await sb.from('jornada_conferencia').upsert({jornada_id:jid,item:it,ok:true,obs:null,conferido_por:ME.id,conferido_em:new Date().toISOString()});
      if(error){toast(err(error));return}
      estado[it]={ok:true,obs:''};renderItens();atualizaProg();
    });
    iw.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{
      const it=CONF_ITENS[b.dataset.no];
      const {error}=await sb.from('jornada_conferencia').upsert({jornada_id:jid,item:it,ok:false,obs:'',conferido_por:ME.id,conferido_em:new Date().toISOString()});
      if(error){toast(err(error));return}
      estado[it]={ok:false,obs:''};renderItens();atualizaProg();
    });
    iw.querySelectorAll('[data-obs]').forEach(t=>t.addEventListener('change',async()=>{
      const it=CONF_ITENS[t.dataset.obs];
      estado[it].obs=t.value;
      const {error}=await sb.from('jornada_conferencia').upsert({jornada_id:jid,item:it,ok:false,obs:t.value,conferido_por:ME.id,conferido_em:new Date().toISOString()});
      if(error)toast(err(error));
    }));
  };
  const atualizaProg=()=>{
    const ok=CONF_ITENS.filter(it=>estado[it]&&estado[it].ok===true).length;
    const no=CONF_ITENS.filter(it=>estado[it]&&estado[it].ok===false).length;
    $('cf-prog').textContent=`${ok}/5 conferidos${no?` · ${no} pendente(s) — fica registrado quem marcou e quando`:''}`;
    $('cf-fechar').disabled=ok<5;
    $('cf-fechar').textContent=ok<5?`Faltam ${5-ok} item(ns)`:'✓ Fechar jornada';
  };
  renderItens();atualizaProg();

/* ===== gráficos do dashboard (Chart.js, cores do tema) ===== */
const CHARTS={};
function chartTheme(){return {ok:getComputedStyle(document.body).getPropertyValue('--acc').trim()||'#fcc85c'}}
async function renderCharts(e){
  const box=document.getElementById('db-charts');if(!box)return;
  const f=x=>(x||'').slice(0,10);
  const ini='2026-10-01', fim='2026-11-30';
  const [jrn,abs,desp,rec,mlt,despP]=await Promise.all([
    empFilter(sb.from('jornadas').select('inicio,km_inicial,km_final,veiculo_id,motorista_id,status')).gte('inicio',ini).lte('inicio',fim+'T23:59:59'),
    empFilter(sb.from('abastecimentos').select('veiculo_id,litros,valor_total,data')).gte('data',ini).lte('data',fim+'T23:59:59'),
    empFilter(sb.from('despesas').select('valor,categoria,data')).gte('data',ini).lte('data',fim+'T23:59:59'),
    empFilter(sb.from('recebimentos').select('valor,tipo,data')).gte('data',ini).lte('data',fim+'T23:59:59'),
    empFilter(sb.from('multas').select('valor,data_infracao')).gte('data_infracao',ini),
    empFilter(sb.from('despesas').select('valor,data')).eq('status','aguardando').gte('data',ini).lte('data',fim+'T23:59:59')
  ]);
  const J=jrn.data||[],A=abs.data||[],D=desp.data||[],R=rec.data||[],M=mlt.data||[],DP=despP.data||[];
  const meses=['Jun','Jul','Ago','Set','Out','Nov'];
  const mk=()=>{const m={};meses.forEach(x=>m[x]=0);return m};
  const mRec=mk(),mDesp=mk(),mLuc=mk(),mMult=mk(),mPend=mk();
  const idx=dt=>{const mm=(dt||'').slice(5,7);return meses[Number(mm)-6]||null};
  R.forEach(x=>{const k=idx(x.data);if(k){mRec[k]+=Number(x.valor);mLuc[k]+=Number(x.valor)}});
  D.forEach(x=>{const k=idx(x.data);if(k){mDesp[k]+=Number(x.valor);mLuc[k]-=Number(x.valor)}});
  M.forEach(x=>{const k=idx(x.data_infracao);if(k)mMult[k]+=Number(x.valor||0)});
  DP.forEach(x=>{const k=idx(x.data);if(k)mPend[k]+=Number(x.valor||0)});
  const fmtK=v=>v>=1000?(v/1000).toFixed(1).replace('.',',')+'k':Math.round(v);
  const acc=chartTheme().ok;
  const bar=(id,labels,s1,n1,s2,n2,c1,c2)=>{
    if(CHARTS[id])CHARTS[id].destroy();
    CHARTS[id]=new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[
      {label:n1,data:s1,backgroundColor:c1},{label:n2,data:s2,backgroundColor:c2}]},
      options:{responsive:true,plugins:{legend:{labels:{color:'#9a9a9a',font:{size:10}}}},
      scales:{x:{ticks:{color:'#9a9a9a',font:{size:9}}},y:{ticks:{color:'#9a9a9a',font:{size:9},callback:fmtK}}}}});
  };
  const bar1=(id,labels,vals,nome,cores)=>{
    if(CHARTS[id])CHARTS[id].destroy();
    CHARTS[id]=new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[{label:nome,data:vals,backgroundColor:cores||acc}]},
      options:{responsive:true,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#9a9a9a',font:{size:9}}},y:{ticks:{color:'#9a9a9a',font:{size:9},callback:fmtK}}}}});
  };
  const line1=(id,labels,vals,nome)=>{
    if(CHARTS[id])CHARTS[id].destroy();
    CHARTS[id]=new Chart(document.getElementById(id),{type:'line',data:{labels,datasets:[{label:nome,data:vals,borderColor:'#4a90d9',backgroundColor:'rgba(74,144,217,.12)',fill:true,tension:.3,pointRadius:3}]},
      options:{responsive:true,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#9a9a9a',font:{size:9}}},y:{ticks:{color:'#9a9a9a',font:{size:9}}}}}});
  };
  const donut=(id,labels,vals)=>{
    if(CHARTS[id])CHARTS[id].destroy();
    CHARTS[id]=new Chart(document.getElementById(id),{type:'doughnut',data:{labels,datasets:[{data:vals,backgroundColor:[acc,'#4a90d9','#3ecf6e','#e05252','#9a6ad9','#e0a052','#777'],borderColor:'#1a1a1a',borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#9a9a9a',font:{size:10},boxWidth:12}}}}});
  };
  // ---- abas ----
  const temDin=(e==='GRUPO'||e==='TRANSPORTADORA')&&(R.length||D.length);
  const temOpe=!!(J.length||A.length);
  const temCtl=!!(M.length||DP.length);
  const tabs=[temDin?['dinheiro','💰 Dinheiro']:null,temOpe?['operacao','🚚 Operação']:null,temCtl?['controle','📋 Controle']:null].filter(Boolean);
  if(!tabs.length){box.innerHTML=empty('Sem dados no período para gráficos');return}
  if(!window.__dbTab||!tabs.find(t=>t[0]===window.__dbTab))window.__dbTab=tabs[0][0];
  box.innerHTML=`<div class="dbtabs">${tabs.map(t=>`<button data-t="${t[0]}" class="${window.__dbTab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div><div id="db-tab-body"></div>`;
  box.querySelectorAll('.dbtabs button').forEach(b=>b.onclick=()=>{window.__dbTab=b.dataset.t;box.querySelectorAll('.dbtabs button').forEach(x=>x.classList.toggle('on',x===b));renderTab()});
  function renderTab(){
    const el=document.getElementById('db-tab-body');if(!el)return;
    Object.keys(CHARTS).forEach(k=>{try{CHARTS[k]&&CHARTS[k].destroy&&CHARTS[k].destroy()}catch(_){}delete CHARTS[k]});
    let html='';const t=window.__dbTab;
    if(t==='dinheiro'){
      html+=`<div class="sec"><h3>💰 Recebimentos × Despesas (6 meses)</h3><div style="height:210px"><canvas id="ch-recdesp"></canvas></div></div>`;
      html+=`<div class="sec"><h3>📈 Lucro por mês (recebeu − gastou)</h3><div style="height:190px"><canvas id="ch-lucro"></canvas></div></div>`;
      html+=`<div class="sec"><h3>🥧 Despesas por tipo (período)</h3><div style="height:230px"><canvas id="ch-tipo"></canvas></div></div>`;
      el.innerHTML=html;
      bar('ch-recdesp',meses,Object.values(mRec).map(x=>Math.round(x)),'Recebimentos',Object.values(mDesp).map(x=>Math.round(x)),'Despesas',acc,'#e05252');
      const luc=Object.values(mLuc).map(x=>Math.round(x));
      bar1('ch-lucro',meses,luc,'Lucro (R$)',luc.map(v=>v>=0?'#3ecf6e':'#e05252'));
      const porTipo={};D.forEach(x=>{const g=(x.categoria||'Outros').trim()||'Outros';porTipo[g]=(porTipo[g]||0)+Number(x.valor||0)});
      let ent=Object.entries(porTipo).sort((a,b)=>b[1]-a[1]);
      if(ent.length>6){ent=ent.slice(0,5).concat([['Outros',ent.slice(5).reduce((s,x)=>s+x[1],0)]])}
      donut('ch-tipo',ent.map(x=>x[0]),ent.map(x=>Math.round(x[1])));
    }
    if(t==='operacao'){
      html+=`<div class="sec"><h3>🛣️ Jornadas por dia (30 dias)</h3><div style="height:190px"><canvas id="ch-jordia"></canvas></div></div>`;
      html+=`<div class="sec"><h3>⛽ km/L por caminhão (período)</h3><div style="height:300px"><canvas id="ch-kml"></canvas></div></div>`;
      html+=`<div class="sec"><h3>📉 km/L da frota por mês</h3><div style="height:180px"><canvas id="ch-kmlmes"></canvas></div></div>`;
      el.innerHTML=html;
      const dias=[...new Set(J.map(x=>f(x.inicio)))].sort().slice(-30);
      if(dias.length){
        const cnt=dias.map(d=>J.filter(x=>f(x.inicio)===d).length);
        CHARTS.jd=new Chart(document.getElementById('ch-jordia'),{type:'line',data:{labels:dias.map(d=>d.slice(8,10)+'/'+d.slice(5,7)),datasets:[{label:'Jornadas',data:cnt,borderColor:acc,backgroundColor:'rgba(255,255,255,.06)',fill:true,tension:.3,pointRadius:2}]},
          options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9a9a9a',font:{size:8},maxRotation:0,autoSkip:true,maxTicksLimit:10}},y:{ticks:{color:'#9a9a9a',font:{size:9}}}}}});
      }
      (async()=>{
        const porV={};
        A.forEach(a=>{const g=porV[a.veiculo_id]=porV[a.veiculo_id]||{L:0,km:0};g.L+=Number(a.litros||0)});
        J.filter(x=>x.km_final!=null).forEach(x=>{if(porV[x.veiculo_id])porV[x.veiculo_id].km+=Number(x.km_final)-Number(x.km_inicial)});
        const ids=Object.keys(porV);
        if(!ids.length)return;
        const vs2=await sb.from('veiculos').select('id,placa').in('id',ids);
        const placa={};(vs2.data||[]).forEach(x=>placa[x.id]=x.placa);
        const rows=ids.map(id=>({p:placa[id]||'?',kml:porV[id].L>0?porV[id].km/porV[id].L:0})).filter(r=>r.kml>0.1);
        rows.sort((a,b)=>b.kml-a.kml);
        if(document.getElementById('ch-kml')){
          if(CHARTS.kml)CHARTS.kml.destroy();
          CHARTS.kml=new Chart(document.getElementById('ch-kml'),{type:'bar',data:{labels:rows.map(r=>r.p),datasets:[{label:'km/L',data:rows.map(r=>r.kml),backgroundColor:acc}]},
            options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9a9a9a',font:{size:9}}},y:{ticks:{color:'#9a9a9a',font:{size:9}}}}}});
        }
        const mL=mk(),mKm=mk();
        A.forEach(a=>{const k=idx(a.data);if(k)mL[k]+=Number(a.litros||0)});
        J.filter(x=>x.km_final!=null).forEach(x=>{const k=idx(x.inicio);if(k)mKm[k]+=Number(x.km_final)-Number(x.km_inicial)});
        const kmlM=meses.map(m=>mL[m]>0?Math.round(mKm[m]/mL[m]*10)/10:0);
        if(document.getElementById('ch-kmlmes')){
          if(kmlM.some(v=>v>0))line1('ch-kmlmes',meses,kmlM,'km/L');
          else document.getElementById('ch-kmlmes').closest('.sec').innerHTML='<p class="hint">Sem abastecimentos suficientes para o km/L mensal.</p>';
        }
      })();
    }
    if(t==='controle'){
      html+=`<div class="sec"><h3>🚨 Multas por mês (R$)</h3><div style="height:190px"><canvas id="ch-mult"></canvas></div></div>`;
      html+=`<div class="sec"><h3>⏳ Reembolsos aguardando aprovação (R$/mês)</h3><div style="height:190px"><canvas id="ch-pend"></canvas></div></div>`;
      el.innerHTML=html;
      bar1('ch-mult',meses,Object.values(mMult).map(x=>Math.round(x)),'Multas (R$)','#e05252');
      bar1('ch-pend',meses,Object.values(mPend).map(x=>Math.round(x)),'Pendente (R$)','#e0a052');
    }
  }
  renderTab();
}
PAGES.relatorios=async el=>{
  el.innerHTML=`<h1 class="pg">Relatórios</h1><div id="rel">${empty('Carregando…')}</div>`;
  const ini='2026-06-01', fim='2026-11-30';
  const [mts,jrn,abs,desp,mlt]=await Promise.all([
    empFilter(sb.from('motoristas').select('id,nome,empresa')),
    empFilter(sb.from('jornadas').select('motorista_id,km_inicial,km_final,inicio')).gte('inicio',ini).lte('inicio',fim+'T23:59:59'),
    empFilter(sb.from('abastecimentos').select('motorista_id,posto,litros,valor_total,data')).gte('data',ini).lte('data',fim+'T23:59:59'),
    empFilter(sb.from('despesas').select('motorista_id,categoria,valor,data')).gte('data',ini).lte('data',fim+'T23:59:59'),
    empFilter(sb.from('multas').select('motorista_id,valor,data_infracao')).gte('data_infracao',ini)
  ]);
  const M=mts.data||[],J=jrn.data||[],A=abs.data||[],D=desp.data||[],X=mlt.data||[];
  const box=$('rel');
  const fmtK=v=>v>=1000?(v/1000).toFixed(1).replace('.',',')+'k':Math.round(v);
  const acc=chartTheme().ok;
  const meses=['Jun','Jul','Ago','Set','Out','Nov'];
  const idx=dt=>{const mm=(dt||'').slice(5,7);return meses[Number(mm)-6]||null};
  const mk=()=>{const m={};meses.forEach(x=>m[x]=0);return m};
  const mComb=mk(),mDesp=mk();
  A.forEach(x=>{const k=idx(x.data);if(k)mComb[k]+=Number(x.valor_total||0)});
  D.forEach(x=>{const k=idx(x.data);if(k)mDesp[k]+=Number(x.valor||0)});
  // ---- postos ----
  const postos={};
  A.forEach(x=>{const pn=(x.posto||'—').trim()||'—';const g=postos[pn]=postos[pn]||{n:0,L:0,R:0};g.n++;g.L+=Number(x.litros||0);g.R+=Number(x.valor_total||0)});
  const pTop=Object.entries(postos).sort((a,b)=>b[1].R-a[1].R);
  // ---- categorias ----
  const cats={};
  D.forEach(x=>{const c=(x.categoria||'Outros').trim()||'Outros';cats[c]=(cats[c]||0)+Number(x.valor||0)});
  const cTop=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const ehManut=c=>/pe[cç]a|pneu|manuten|borrachari|mec[aâ]nic|[óo]leo|oficina/i.test(c||'');
  // ---- motoristas ----
  const mot={};
  M.forEach(m=>mot[m.id]={nome:m.nome,nJ:0,km:0,L:0,comb:0,manut:0,outras:0,multas:0,vMultas:0});
  J.forEach(x=>{const g=mot[x.motorista_id];if(!g)return;g.nJ++;if(x.km_final!=null)g.km+=Number(x.km_final)-Number(x.km_inicial)});
  A.forEach(x=>{const g=mot[x.motorista_id];if(!g)return;g.L+=Number(x.litros||0);g.comb+=Number(x.valor_total||0)});
  D.forEach(x=>{const g=mot[x.motorista_id];if(!g)return;if(ehManut(x.categoria))g.manut+=Number(x.valor||0);else g.outras+=Number(x.valor||0)});
  X.forEach(x=>{const g=mot[x.motorista_id];if(!g)return;g.multas++;g.vMultas+=Number(x.valor||0)});
  Object.values(mot).forEach(g=>{g.total=g.comb+g.manut+g.outras+g.vMultas;g.kml=g.L>0?g.km/g.L:0});
  let rows=Object.values(mot).filter(g=>g.nJ||g.comb||g.manut||g.outras||g.multas);
  // ---- abas ----
  const tabs=[['gastos','💰 Gastos'],['motoristas','🧑‍✈️ Motoristas']];
  if(!window.__relTab)window.__relTab='gastos';
  const destr=()=>{Object.keys(CHARTS).forEach(k=>{if(k.startsWith('rel')){try{CHARTS[k].destroy()}catch(_){}delete CHARTS[k]}})};
  function renderTab(){
    destr();
    const t=window.__relTab;
    let html=`<div class="dbtabs">${tabs.map(x=>`<button data-t="${x[0]}" class="${t===x[0]?'on':''}">${x[1]}</button>`).join('')}</div><div id="rel-body"></div>`;
    box.innerHTML=html;
    box.querySelectorAll('.dbtabs button').forEach(b=>b.onclick=()=>{window.__relTab=b.dataset.t;renderTab()});
    const el=document.getElementById('rel-body');
    if(t==='gastos'){
      const tComb=A.reduce((s,x)=>s+Number(x.valor_total||0),0),tDesp=D.reduce((s,x)=>s+Number(x.valor||0),0);
      el.innerHTML=`<div class="kpis">
        <div class="kpi"><div class="v">${fmtBRL(tComb+tDesp)}</div><div class="l">Total gasto (6 meses)</div></div>
        <div class="kpi"><div class="v">${fmtBRL(tComb)}</div><div class="l">⛽ Combustível</div></div>
        <div class="kpi"><div class="v">${fmtBRL(tDesp)}</div><div class="l">🔧 Outras despesas</div></div>
        <div class="kpi"><div class="v">${pTop.length}</div><div class="l">Postos diferentes</div></div>
      </div>
      <div class="sec"><h3>📅 Gasto por mês — combustível × despesas</h3><div style="height:210px"><canvas id="rel-mes"></canvas></div></div>
      <div class="sec"><h3>🏪 Postos — quanto abasteceu em cada um</h3>
        ${pTop.length?`<p class="hint">🏆 O posto que mais abastece: <b>${esc(pTop[0][0])}</b> — ${pTop[0][1].n} abastecimentos · ${fmtBRL(pTop[0][1].R)} · ${Math.round(pTop[0][1].L).toLocaleString('pt-BR')} L</p><div style="height:${Math.min(pTop.length,8)*34+40}px"><canvas id="rel-postos"></canvas></div>`:`<p class="hint">Sem abastecimentos no período.</p>`}
      </div>
      <div class="sec"><h3>🥧 Despesas por tipo</h3>${cTop.length?`<div style="height:230px"><canvas id="rel-cats"></canvas></div>`:`<p class="hint">Sem despesas no período.</p>`}</div>`;
      if(CHARTS['rel-mes'])CHARTS['rel-mes'].destroy();
      CHARTS['rel-mes']=new Chart(document.getElementById('rel-mes'),{type:'bar',data:{labels:meses,datasets:[
        {label:'⛽ Combustível',data:meses.map(m=>Math.round(mComb[m])),backgroundColor:acc},
        {label:'🔧 Despesas',data:meses.map(m=>Math.round(mDesp[m])),backgroundColor:'#4a90d9'}]},
        options:{responsive:true,plugins:{legend:{labels:{color:'#9a9a9a',font:{size:10}}}},scales:{x:{ticks:{color:'#9a9a9a',font:{size:9}}},y:{ticks:{color:'#9a9a9a',font:{size:9},callback:fmtK}}}}});
      if(pTop.length){
        const top=pTop.slice(0,8);
        CHARTS['rel-postos']=new Chart(document.getElementById('rel-postos'),{type:'bar',data:{labels:top.map(x=>x[0]),datasets:[{label:'R$ abastecidos',data:top.map(x=>Math.round(x[1].R)),backgroundColor:acc}]},
          options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9a9a9a',font:{size:9},callback:fmtK}},y:{ticks:{color:'#9a9a9a',font:{size:9}}}}}});
      }
      if(cTop.length){
        let ent=cTop.slice(0,6);
        if(cTop.length>6)ent=ent.slice(0,5).concat([['Outros',cTop.slice(5).reduce((s,x)=>s+x[1],0)]]);
        CHARTS['rel-cats']=new Chart(document.getElementById('rel-cats'),{type:'doughnut',data:{labels:ent.map(x=>x[0]),datasets:[{data:ent.map(x=>Math.round(x[1])),backgroundColor:[acc,'#4a90d9','#3ecf6e','#e05252','#9a6ad9','#e0a052'],borderColor:'#1a1a1a',borderWidth:2}]},
          options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#9a9a9a',font:{size:10},boxWidth:12}}}}});
      }
    }
    if(t==='motoristas'){
      const ordenar={km:(a,b)=>b.km-a.km,manut:(a,b)=>b.manut-a.manut,total:(a,b)=>b.total-a.total};
      if(!window.__relSort)window.__relSort='km';
      rows.sort(ordenar[window.__relSort]);
      el.innerHTML=`<div class="dbtabs" style="margin-top:0">
        <button data-s="km" class="${window.__relSort==='km'?'on':''}">🛣️ Mais rodou</button>
        <button data-s="manut" class="${window.__relSort==='manut'?'on':''}">🔧 Mais gastou manutenção</button>
        <button data-s="total" class="${window.__relSort==='total'?'on':''}">💰 Maior gasto total</button>
      </div>
      <div class="sec"><div class="tblwrap"><table><tr><th>Motorista</th><th>Jorn.</th><th>Km</th><th>km/L</th><th>⛽ R$</th><th>🔧 Manut. R$</th><th>Outros R$</th><th>🚨 Multas</th><th>TOTAL R$</th></tr>
      ${rows.map((g,i)=>`<tr${i===0?' style="background:rgba(252,200,92,.08)"':''}><td><b>${esc(g.nome)}</b></td><td>${g.nJ}</td><td>${Math.round(g.km).toLocaleString('pt-BR')}</td><td>${g.kml?g.kml.toFixed(1).replace('.',','):'—'}</td><td>${Math.round(g.comb).toLocaleString('pt-BR')}</td><td>${Math.round(g.manut).toLocaleString('pt-BR')}</td><td>${Math.round(g.outras).toLocaleString('pt-BR')}</td><td>${g.multas?g.multas+' × '+Math.round(g.vMultas).toLocaleString('pt-BR'):'—'}</td><td><b>${Math.round(g.total).toLocaleString('pt-BR')}</b></td></tr>`).join('')}
      </table></div><p class="hint">Período: jun → nov 2026 · linha destacada = 1º do critério escolhido · manutenção = peças, pneus, mecânica e óleo.</p></div>`;
      el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{window.__relSort=b.dataset.s;renderTab()});
    }
  }
  renderTab();
};

PAGES.motoristas=async el=>{

  <td>${ME.perfil==='gerencia'?`<button class="btn mini" data-vv="${m.id}">🚚 veículo</button> <button class="btn mini" data-ed="${m.id}">✏️</button> <button class="btn mini" data-tg="${m.id}" data-a="${m.ativo?0:1}">${m.ativo?'Inativar':'Reativar'}</button>`:''}</td></tr>`}).join('')}</table></div>`;
  l.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{

    const {data:atual}=await sb.from('motorista_veiculo').select('id,veiculo_id,ativo,veiculos(placa)').eq('motorista_id',mid);
    const ativos=new Set((atual||[]).filter(x=>x.ativo).map(x=>x.veiculo_id));
    const campos=(vs||[]).map(v=>({id:'vv-'+v.id,label:v.placa+(v.modelo?' · '+v.modelo:'')+(v.empresa&&v.empresa!=='AMBAS'?' ('+v.empresa+')':''),tipo:'vvchk',valor:ativos.has(v.id)}));
    const w=document.getElementById('modal-wrap'),m=document.getElementById('modal');
    m.innerHTML=`<h3>🚚 Veículos do motorista</h3><p class="hint" style="margin:0 0 8px">Toque para marcar/desmarcar. Pode deixar vários — o caminhão em viagem fica bloqueado sozinho.</p>`+
      campos.map(f=>`<label style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #242424;cursor:pointer"><input type="checkbox" id="${f.id}" ${f.valor?'checked':''} style="width:18px;height:18px;accent-color:var(--acc)"><span style="font-size:13px">${esc(f.label)}</span></label>`).join('')+
      `<div class="mrow"><button class="btn sec" id="m-cancel">Cancelar</button><button class="btn" id="m-ok">Salvar</button></div>`;
    w.classList.add('open');
    document.getElementById('m-cancel').onclick=()=>w.classList.remove('open');
    w.onclick=e=>{if(e.target===w)w.classList.remove('open')};
    document.getElementById('m-ok').onclick=async()=>{
      let n=0;
      for(const v of vs||[]){
        const marcado=document.getElementById('vv-'+v.id).checked;

      w.classList.remove('open');toast(n?'Vínculos atualizados':'Nada mudou');go('motoristas');

      const sit=(v['ed-cpf']&&v['ed-cnh']&&v['ed-val'])?'completo':'incompleto';
      return await upd('motoristas',m.id,{cpf:v['ed-cpf']||null,cnh:v['ed-cnh']||null,cnh_categoria:v['ed-cat']||null,cnh_validade:v['ed-val']||null,contato:v['ed-cont']||null,situacao:sit})?(go('motoristas'),true):false;
    });
  });
};
PAGES.jornadas=async el=>{
  el.innerHTML=`<h1 class="pg">Jornadas</h1><div id="jn">${empty('Carregando…')}</div>`;
  const {data:lista}=await empFilter(sb.from('jornadas').select('*, veiculos(placa), motoristas(nome)')).order('inicio',{ascending:false}).limit(200);
  const l=$('jn');
  if(!lista||!lista.length){l.innerHTML=empty('Nenhuma jornada');return}
  l.innerHTML=`<div class="tblwrap"><table><tr><th>Saída</th><th>Motorista</th><th>Veículo</th><th>Roteiro nº</th><th>Km</th><th>Ocorrências</th><th>Status</th></tr>
  ${lista.map(j=>`<tr><td>${fmtDT(j.inicio)}</td><td>${esc(j.motoristas?.nome)}</td><td>${esc(j.veiculos?.placa)}</td><td>${j.roteiro}</td><td>${km(j.km_inicial)}${j.km_final!=null?' → '+km(j.km_final):''}</td><td>${esc(j.ocorrencias||'—')}</td><td>${tag(j.status)}</td></tr>`).join('')}</table></div>`;
};
PAGES.os=async el=>{
  el.innerHTML=`<h1 class="pg">Ordens de serviço</h1>
  ${ME.perfil==='mecanico'?'':`<div class="sec"><h3>Abrir OS</h3>
    <label>Veículo</label><select id="o-veic"></select>
    <label>Descrição do problema/serviço</label><textarea id="o-desc"></textarea>
    <label>Vincular aviso (opcional)</label><select id="o-aviso"><option value="">—</option></select>
    <button class="btn" id="o-btn">Abrir ordem de serviço</button><div class="msg" id="o-msg"></div></div>`}
  <div id="o-list">${empty('Carregando…')}</div>`;
  if(ME.perfil!=='mecanico'){
    const {data:veics}=await sel('veiculos','id,placa,ativo','placa');
    $('o-veic').innerHTML=(veics||[]).filter(v=>v.ativo).map(v=>`<option value="${v.id}">${esc(v.placa)}</option>`).join('');
    const {data:avs}=await sb.from('avisos').select('id,texto,veiculos(placa)').in('status',['recebido','em_analise','encaminhado']).order('criado_em',{ascending:false});
    $('o-aviso').innerHTML+= (avs||[]).map(a=>`<option value="${a.id}">${esc(a.veiculos?.placa)} — ${esc(a.texto.slice(0,40))}</option>`).join('');
    $('o-btn').onclick=async()=>{
      const desc=$('o-desc').value.trim(),vid=$('o-veic').value;
      if(!desc||!vid){$('o-msg').className='msg err';$('o-msg').textContent='Escolha o veículo e descreva o serviço';return}
      const r=await ins('ordens_servico',insEmp({veiculo_id:vid,descricao:desc,aviso_id:$('o-aviso').value||null,aberta_por:ME.id}));
      if(r){toast('OS aberta');go('os')}
    };
  }
  const {data:lista}=await empFilter(sb.from('ordens_servico').select('*, veiculos(placa)')).order('aberta_em',{ascending:false}).limit(100);
  const l=$('o-list');
  if(!lista||!lista.length){l.innerHTML=empty('Nenhuma OS');return}
  const FLOW={recebida:'em_analise',em_analise:'aguardando_peca',aguardando_peca:'em_execucao',em_execucao:'concluida'};
  const LBL={recebida:'▶ Iniciar análise',em_analise:'⏳ Aguardando peça',aguardando_peca:'🔨 Em execução',em_execucao:'✓ Concluir'};
  l.innerHTML=`<div class="tblwrap"><table><tr><th>Aberta</th><th>Veículo</th><th>Descrição</th><th>Diagnóstico</th><th>Custos</th><th>Status</th><th></th></tr>
  ${lista.map(o=>`<tr><td>${fmtDT(o.aberta_em)}</td><td>${esc(o.veiculos?.placa)}</td><td>${esc(o.descricao)}</td><td>${esc(o.diagnostico||'—')}</td><td>${o.mao_obra||o.custos?fmtBRL(Number(o.mao_obra||0)+Number(o.custos||0)):'—'}</td><td>${tag(o.status)}</td>
  <td>${ME.perfil==='mecanico'&&o.status!=='concluida'?`<button class="btn mini" data-osd="${o.id}">✏️ Atualizar</button>`:''}</td></tr>`).join('')}</table></div>`;
  l.querySelectorAll('[data-osd]').forEach(b=>b.onclick=async()=>{
    const o=lista.find(x=>x.id===b.dataset.osd);
    openModal('Atualizar OS — '+(o.veiculos?.placa||''),[
      {id:'os-diag',label:'Diagnóstico',tipo:'textarea',valor:o.diagnostico||''},
      {id:'os-serv',label:'Serviço realizado',tipo:'textarea',valor:o.servico||''},
      {id:'os-pecas',label:'Peças utilizadas',valor:o.pecas||''},
      {id:'os-mo',label:'Mão de obra (R$)',tipo:'number',valor:o.mao_obra||''},
      {id:'os-custos',label:'Outros custos (R$)',tipo:'number',valor:o.custos||''},
    ],async v=>{
      const novoStatus=FLOW[o.status]||o.status;
      const r=await upd('ordens_servico',o.id,{diagnostico:v['os-diag'],servico:v['os-serv'],pecas:v['os-pecas'],mao_obra:parseFloat(v['os-mo'])||null,custos:parseFloat(v['os-custos'])||null,status:novoStatus,concluida_em:novoStatus==='concluida'?new Date().toISOString():o.concluida_em});
      if(r){toast('OS atualizada');go('os');return true}
      return false;
    });
  });
};
PAGES.usuarios=async el=>{
  el.innerHTML=`<h1 class="pg">Usuários</h1><div id="u-pend">${empty('Carregando…')}</div><div id="u-list">${empty('')}</div>`;
  const lista=await sel('usuarios','*','nome');
  const l=$('u-list'),pw=$('u-pend');
  if(!lista){l.innerHTML=empty('Erro ao carregar');pw.innerHTML='';return}
  const pend=lista.filter(u=>u.perfil==='pendente');
  const ativos=lista.filter(u=>u.perfil!=='pendente');
  // ---- pendentes ----
  if(pend.length){
    pw.innerHTML=`<div class="sec"><h3>⏳ Aguardando sua aprovação (${pend.length})</h3>`+pend.map(u=>{
      const emailOk=/^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/.test(u.email||'');
      const nomeOk=u.nome&&u.nome.trim().length>=3&&!/[0-9._-]{3,}/.test(u.nome);
      return `<div style="padding:10px 0;border-bottom:1px solid #242424;font-size:13px">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
          <div style="min-width:0">
            <b>${esc(u.nome)}</b>${nomeOk?'':' <span class="tag reprovada">nome estranho?</span>'}
            <div class="hint" style="word-break:break-all">${esc(u.email||'—')}${emailOk?'':' <span class="tag reprovada">e-mail inválido</span>'}</div>
            <div class="hint">criou conta em ${fmtDT(u.criado_em)}</div>
          </div>
        </div>
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center">
          <select data-perfil="${u.id}" class="mini-sel">${opt([['motorista','Motorista'],['conferente','Conferente'],['mecanico','Mecânico'],['gerencia','Gerência']],u.perfil!=='pendente'?u.perfil:'motorista')}</select>
          <select data-emp="${u.id}" class="mini-sel">${opt([['OVOS','OVOS'],['TRANSPORTADORA','Transportadora'],['AMBAS','Ambas']],u.empresa&&u.empresa!=='OVOS'?u.empresa:'OVOS')}</select>
          <span data-veic-wrap="${u.id}" style="display:none"><select data-veic="${u.id}" class="mini-sel"><option value="">— sem veículo —</option></select></span>
          <button class="btn mini" data-apr="${u.id}">✓ Aprovar</button>
          <button class="btn mini" data-rec="${u.id}" style="border-color:#5c3a2e">✗ Recusar</button>
        </div>
        <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;font-size:11px;color:var(--mut)">
          <span>CPF: <input data-cpf="${u.id}" value="${esc(u.cpf||'')}" style="width:110px;background:var(--field);color:var(--ink);border:1px solid #333;border-radius:6px;padding:4px 6px;font-size:11px"></span>
          <span>CNH: <input data-cnh="${u.id}" value="${esc(u.cnh||'')}" style="width:90px;background:var(--field);color:var(--ink);border:1px solid #333;border-radius:6px;padding:4px 6px;font-size:11px"></span>
          <span>Cat.: <input data-cat="${u.id}" value="${esc(u.cnh_categoria||'')}" placeholder="D/E" style="width:44px;background:var(--field);color:var(--ink);border:1px solid #333;border-radius:6px;padding:4px 6px;font-size:11px"></span>
          <span>Validade: <input data-val="${u.id}" type="date" value="${esc(u.cnh_validade||'')}" style="background:var(--field);color:var(--ink);border:1px solid #333;border-radius:6px;padding:4px 6px;font-size:11px"></span>
          <span>Contato: <input data-cont="${u.id}" value="${esc(u.contato||'')}" style="width:110px;background:var(--field);color:var(--ink);border:1px solid #333;border-radius:6px;padding:4px 6px;font-size:11px"></span>
        </div>
      </div>`}).join('')+`</div>`;
  }else{pw.innerHTML=`<div class="sec"><p class="hint">Nenhum cadastro aguardando aprovação ✓</p></div>`}
  // ---- aprovados ----
  l.innerHTML=ativos.length?`<div class="sec"><h3>👥 Cadastrados (${ativos.length})</h3><div class="tblwrap"><table><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Empresa</th><th></th></tr>
  ${ativos.map(u=>`<tr><td><b>${esc(u.nome)}</b></td><td style="font-size:11px;color:var(--mut);word-break:break-all">${esc(u.email||'—')}</td><td>${tag(u.perfil)}</td><td>${esc(u.empresa||'OVOS')}</td>
  <td><button class="btn mini" data-ued="${u.id}">✏️</button></td></tr>`).join('')}</table></div></div>`:empty('Nenhum usuário aprovado ainda');
  // ---- veículos para vínculo na aprovação ----
  (async()=>{
    const {data:vlist}=await empFilter(sb.from('veiculos').select('id,placa,modelo,empresa')).eq('ativo',true).order('placa');
    pw.querySelectorAll('[data-veic]').forEach(sel=>{
      sel.innerHTML='<option value="">— sem veículo —</option>'+(vlist||[]).map(v=>`<option value="${v.id}">${esc(v.placa)}${v.modelo?' · '+esc(v.modelo):''}${v.empresa&&v.empresa!=='AMBAS'?' ('+v.empresa+')':''}</option>`).join('');
    });
  })();
  // ---- aprovar/recusar ----
  pw.querySelectorAll('[data-perfil]').forEach(sel=>sel.onchange=()=>{
    const id=sel.dataset.perfil,w=document.querySelector(`[data-veic-wrap="${id}"]`);
    if(w)w.style.display=sel.value==='motorista'?'':'none';
  });
  pw.querySelectorAll('[data-apr]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.apr;
    const selP=document.querySelector(`[data-perfil="${id}"]`),selE=document.querySelector(`[data-emp="${id}"]`);
    const p=selP.value,e=selE.value;
    const g=n=>document.querySelector(`[${n}="${id}"]`);
    const dados={cpf:g('data-cpf')?.value.trim()||null,cnh:g('data-cnh')?.value.trim()||null,cnh_categoria:g('data-cat')?.value.trim()||null,cnh_validade:g('data-val')?.value||null,contato:g('data-cont')?.value.trim()||null};
    const sit=(dados.cpf&&dados.cnh&&dados.cnh_validade)?'completo':'incompleto';
    const r=await upd('usuarios',id,{perfil:p,empresa:e,...dados});
    if(!r)return;
    if(p==='motorista'){
      const {data:mex}=await sb.from('motoristas').select('id').eq('usuario_id',id).maybeSingle();
      let mid=mex?.id;
      if(!mid){const u=lista.find(x=>x.id===id);const {data:mn}=await sb.from('motoristas').insert({nome:u?u.nome:'Motorista',usuario_id:id,situacao:sit,empresa:e==='AMBAS'?'OVOS':e,...dados}).select('id');mid=mn?.[0]?.id}
      else{await sb.from('motoristas').update({empresa:e==='AMBAS'?'OVOS':e,situacao:sit,...dados}).eq('usuario_id',id)}
      const vid=document.querySelector(`[data-veic="${id}"]`)?.value;
      if(mid&&vid){await sb.from('motorista_veiculo').insert({motorista_id:mid,veiculo_id:vid,ativo:true})}
    }
    await sb.from('notificacoes').insert({usuario_id:id,titulo:'Cadastro aprovado ✓',corpo:'Seu acesso foi liberado'+(p==='motorista'?' — bom trabalho!':''),link:'home'});
    toast('Aprovado: '+p+' · '+e);go('usuarios');
  });
  pw.querySelectorAll('[data-rec]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.rec;
    if(!confirm('Recusar este cadastro? O usuário fica sem acesso. (Para apagar de vez: Supabase → Authentication)'))return;
    await sb.from('notificacoes').insert({usuario_id:id,titulo:'Cadastro não aprovado',corpo:'Fale com a gerência.'});
    toast('Cadastro recusado — usuário continua sem acesso');go('usuarios');
  });
  // ---- editar aprovado ----
  l.querySelectorAll('[data-ued]').forEach(b=>b.onclick=async()=>{
    const u=lista.find(x=>x.id===b.dataset.ued);if(!u)return;
    const p=prompt('Perfil (gerencia/motorista/conferente/mecanico):',u.perfil||'motorista');if(p===null)return;
    const e=prompt('Empresa (OVOS/TRANSPORTADORA/AMBAS):',u.empresa||'OVOS');if(e===null)return;
    if(await upd('usuarios',u.id,{perfil:p.trim().toLowerCase(),empresa:e.trim().toUpperCase()}))go('usuarios');
  });
};
PAGES.auditoria=async el=>{

  const {data:lista}=await sel('auditoria','*, usuarios(nome)','criado_em');
  const l=$('au');
  if(!lista||!lista.length){l.innerHTML=empty('Sem registros');return}
  l.innerHTML=`<div class="tblwrap"><table><tr><th>Quando</th><th>Quem</th><th>Ação</th></tr>
  ${lista.slice(0,200).map(a=>`<tr><td>${fmtDT(a.criado_em)}</td><td>${esc(a.usuarios?.nome||'—')}</td><td>${esc(a.acao)}</td></tr>`).join('')}</table></div>`;
};
/* ============ RECEBIMENTOS (gerência/conferente) ============ */
PAGES.recebimentos=async el=>{
  el.innerHTML=`<h1 class="pg">Recebimentos</h1><div id="rc">${empty('Carregando…')}</div>`;
  const carregar=async()=>{
    const rc=$('rc');rc.innerHTML=empty('Carregando…');
    let q=sb.from('recebimentos').select('*, veiculos(placa), motoristas(nome), usuarios(nome)').order('data',{ascending:false}).limit(300);
    const e=empAtiva();if(e!=='GRUPO')q=q.in('empresa',[e,'AMBAS']);
    const {data,error}=await q;
    if(error){rc.innerHTML=empty(err(error));return}
    const lista=data||[];
    if(!lista.length){rc.innerHTML=empty('Nenhum recebimento'+(e!=='GRUPO'?' em '+EMPNOME[e]:' no grupo'));return}
    const tot=lista.reduce((s,x)=>s+Number(x.valor),0);
    rc.innerHTML=`<div class="kpis"><div class="kpi"><div class="v">${fmtBRL(tot)}</div><div class="l">Total (${e==='GRUPO'?'grupo':EMPNOME[e]})</div></div><div class="kpi"><div class="v">${lista.length}</div><div class="l">Lançamentos</div></div></div>
    <div class="tblwrap"><table><tr><th>Data</th><th>Tipo</th><th>Veículo</th><th>Motorista</th><th>Valor</th><th>Lançado por</th><th>Extras</th><th></th></tr>
    ${lista.map(x=>`<tr><td>${fmtDT(x.data)}</td><td><b>${esc(x.tipo)}</b></td><td>${esc(x.veiculos?.placa||'—')}</td><td>${esc(x.motoristas?.nome||'—')}</td><td>${fmtBRL(x.valor)}</td><td>${esc(x.usuarios?.nome||'—')}</td><td>${x.extras&&Object.keys(x.extras).length?esc(Object.entries(x.extras).map(([k,v])=>k+': '+v).join(' · ')):'—'}</td><td>${x.foto_path?`<button class="btn mini" data-foto="${x.foto_path}">👁</button>`:'—'}</td></tr>`).join('')}</table></div>`;
    rc.querySelectorAll('[data-foto]').forEach(b=>b.onclick=async()=>{const url=await assinar(b.dataset.foto);if(url)window.open(url,'_blank')});
  };
  carregar();
};
/* ============ RECEBIMENTO — lançamento (motorista Transportadora) ============ */
PAGES.recnovo=async el=>{
  el.innerHTML=`<h1 class="pg">Incluir recebimento</h1><div class="sec"><h3>Novo recebimento</h3><div id="rn-f">${empty('Carregando…')}</div></div>`;
  const f=$('rn-f');
  const {data:tipos}=await sb.from('tipos_recebimento').select('*').eq('ativo',true).eq('empresa','TRANSPORTADORA');
  const {data:veics}=await sb.from('motorista_veiculo').select('veiculo_id, veiculos(id,placa,modelo)').eq('motorista_id',ME.motorista.id).eq('ativo',true);
  const tps=tipos||[];
  if(!tps.length){f.innerHTML='<div class="msg err">Nenhum tipo de recebimento cadastrado. Peça à gerência.</div>';return}
  f.innerHTML=`<label>Tipo</label><select id="rn-tipo">${opt(tps.map(t=>[t.nome,t.nome]),null)}</select>
  <div id="rn-campos" class="campx"></div>
  <label>Valor (R$)</label><input id="rn-valor" type="number" step="0.01" inputmode="decimal">
  <label>Veículo</label><select id="rn-veic">${(veics||[]).map(v=>`<option value="${v.veiculo_id}">${esc(v.veiculos.placa)}</option>`).join('')}</select>
  <label>Foto do comprovante *</label><input id="rn-foto" type="file" accept="image/*" capture="environment">
  <label>Observações</label><textarea id="rn-obs"></textarea>
  <button class="btn" id="rn-btn">Lançar recebimento</button><div class="msg" id="rn-msg"></div>`;
  const renderCampos=()=>{
    const t=tps.find(x=>x.nome===$('rn-tipo').value);
    const cs=(t&&t.campos&&t.campos.length)?t.campos:[];
    $('rn-campos').innerHTML=cs.map(c=>`<label>${esc(c.nome)}</label><input class="rx" data-n="${esc(c.nome)}">`).join('');
  };
  $('rn-tipo').onchange=renderCampos;renderCampos();
  $('rn-btn').onclick=async()=>{
    const valor=parseFloat($('rn-valor').value),file=$('rn-foto').files[0];
    if(!valor){$('rn-msg').className='msg err';$('rn-msg').textContent='Informe o valor';return}
    if(!file){$('rn-msg').className='msg err';$('rn-msg').textContent='A foto do comprovante é obrigatória';return}
    const extras={};
    document.querySelectorAll('#rn-campos .rx').forEach(i=>{if(i.value.trim())extras[i.dataset.n]=i.value.trim()});
    const path=`${ME.id}/${Date.now()}.jpg`;
    const p=await uploadFoto(file,path);if(!p)return;
    const r=await ins('recebimentos',insEmp({tipo:$('rn-tipo').value,valor,veiculo_id:$('rn-veic').value||null,motorista_id:ME.motorista.id,data:new Date().toISOString(),foto_path:p,obs:$('rn-obs').value||null,extras,lancado_por:ME.id}));
    if(r){toast('Recebimento lançado!');go('recnovo')}
  };
};
/* ============ TIPOS & CADASTROS (gerência) ============ */
PAGES.tipos=async el=>{
  el.innerHTML=`<h1 class="pg">Tipos & cadastros</h1><div id="tp">${empty('Carregando…')}</div>`;
  const carregar=async()=>{
    const tp=$('tp');
    const e=empAtiva();
    if(e==='GRUPO'){tp.innerHTML=`<div class="sec">Escolha <b>OVOS</b> ou <b>Transportadora</b> acima para gerenciar os tipos desta empresa.</div>`;return}
    const {data:td}=await sb.from('tipos_despesa').select('*').eq('empresa',e).order('nome');
    const {data:tr}=await sb.from('tipos_recebimento').select('*').eq('empresa',e).order('nome');
    tp.innerHTML=`
    <div class="sec"><h3>💸 Tipos de gasto — ${EMPNOME[e]}</h3>
      <div id="td-list">${(td||[]).map(t=>`<div class="dynrow"><span style="flex:1"><b>${esc(t.nome)}</b>${t.campos&&t.campos.length?` <span class="hint">campos: ${esc(t.campos.map(c=>c.nome).join(', '))}</span>`:''}</span><button class="btn mini" data-deltd="${t.id}">🗑</button></div>`).join('')||empty('Nenhum tipo')}</div>
      <div class="dynrow"><input id="td-nome" placeholder="novo tipo de gasto (ex.: LAVAGEM)"><button class="btn mini" id="td-add">＋</button></div>
      <div id="td-campos"></div><div class="msg" id="td-msg"></div></div>
    <div class="sec"><h3>📥 Tipos de recebimento — ${EMPNOME[e]}</h3>
      <div id="tr-list">${(tr||[]).map(t=>`<div class="dynrow"><span style="flex:1"><b>${esc(t.nome)}</b>${t.campos&&t.campos.length?` <span class="hint">campos: ${esc(t.campos.map(c=>c.nome).join(', '))}</span>`:''}</span><button class="btn mini" data-deltr="${t.id}">🗑</button></div>`).join('')||empty('Nenhum tipo')}</div>
      <div class="dynrow"><input id="tr-nome" placeholder="novo tipo de recebimento (ex.: CARGA EXTRA)"><button class="btn mini" id="tr-add">＋</button></div>
      <div id="tr-campos"></div><div class="msg" id="tr-msg"></div></div>`;
    const readCampos=id=>Array.from(document.querySelectorAll('#'+id+' .dynrow input')).map(i=>({nome:i.value.trim()})).filter(c=>c.nome);
    const addCampo=(id,label)=>{const d=document.getElementById(id);if(d&&!d.dataset.on){d.dataset.on='1';d.innerHTML=`<div class="dynrow"><input placeholder="${label}"><button class="btn mini" tabindex="-1">＋ campo</button></div>`;d.querySelector('button').onclick=()=>{const r=document.createElement('div');r.className='dynrow';r.innerHTML=`<input placeholder="${label}"><button class="btn mini" tabindex="-1">✕</button>`;r.querySelector('button').onclick=()=>r.remove();d.appendChild(r)}}};
    addCampo('td-campos','campo obrigatório (ex.: POSTO)');
    addCampo('tr-campos','campo obrigatório (ex.: ORIGEM)');
    $('td-add').onclick=async()=>{
      const nome=$('td-nome').value.trim().toUpperCase();
      if(!nome)return;
      const {error}=await sb.from('tipos_despesa').insert({empresa:e,nome,campos:readCampos('td-campos')});
      if(error){$('td-msg').className='msg err';$('td-msg').textContent=err(error)}else{toast('Tipo criado');carregar()}
    };
    $('tr-add').onclick=async()=>{
      const nome=$('tr-nome').value.trim().toUpperCase();
      if(!nome)return;
      const {error}=await sb.from('tipos_recebimento').insert({empresa:e,nome,campos:readCampos('tr-campos')});
      if(error){$('tr-msg').className='msg err';$('tr-msg').textContent=err(error)}else{toast('Tipo criado');carregar()}
    };
    tp.querySelectorAll('[data-deltd]').forEach(b=>b.onclick=async()=>{const {error}=await sb.from('tipos_despesa').delete().eq('id',b.dataset.deltd);if(error)toast(err(error));else{toast('Tipo removido');carregar()}});
    tp.querySelectorAll('[data-deltr]').forEach(b=>b.onclick=async()=>{const {error}=await sb.from('tipos_recebimento').delete().eq('id',b.dataset.deltr);if(error)toast(err(error));else{toast('Tipo removido');carregar()}});
  };
  carregar();
};

/* ============ notificações ============ */
PAGES.notif=async el=>{
  el.innerHTML=`<h1 class="pg">Notificações</h1><div id="nt">${empty('Carregando…')}</div>`;
  const {data:lista}=await sb.from('notificacoes').select('*').eq('usuario_id',ME.id).order('criado_em',{ascending:false}).limit(50);
  const l=$('nt');
  if(!lista||!lista.length){l.innerHTML=empty('Nada por aqui');return}
  l.innerHTML=lista.map(n=>{
    const podeIr=n.link&&NAV.includes(n.link);
    return `<div class="sec" data-go="${podeIr?esc(n.link):''}" style="padding:12px 16px;${podeIr?'cursor:pointer;border-left:3px solid var(--acc)':''}">
      <b style="font-size:14px">${esc(n.titulo)}</b><p class="hint">${esc(n.corpo||'')}</p>
      <p style="font-size:11px;color:#666">${fmtDT(n.criado_em)}${podeIr?' · <span style="color:var(--acc)">toque para abrir →</span>':''}</p></div>`}).join('');
  l.querySelectorAll('[data-go]').forEach(d=>{if(d.dataset.go)d.onclick=()=>go(d.dataset.go)});
  await sb.from('notificacoes').update({lida:true}).eq('usuario_id',ME.id).eq('lida',false);
  $('bdg').classList.add('hide');
};
</script>
