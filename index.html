<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>CASAGRANDE</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#141414">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#141414;--card:#1e1e1e;--field:#2a2a2a;--ink:#f5f5f5;--mut:#9a9a9a;--acc:#fcc85c;--ok:#4caf50;--bad:#e05252}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;min-height:100dvh}
#app{max-width:1100px;margin:0 auto}
.hide{display:none!important}
/* ---------- login ---------- */
#login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#login img.logo{width:min(320px,78vw);margin-bottom:36px}
.card{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:380px}
.card h2{font-size:17px;margin-bottom:16px;color:var(--ink)}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}
input,select,textarea{width:100%;background:var(--field);border:1px solid #3a3a3a;border-radius:10px;padding:12px;font-size:15px;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:70px}
button{font-family:inherit;cursor:pointer}
.btn{width:100%;background:var(--acc);color:#141414;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;margin-top:18px}
.btn.sec{background:var(--field);color:var(--ink);font-weight:600}
.btn.mini{width:auto;padding:8px 14px;font-size:13px;margin-top:0;border-radius:9px}
.btn:disabled{opacity:.5}
.msg{font-size:13px;margin-top:10px;min-height:16px}
.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
/* ---------- shell ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(20,20,20,.94);backdrop-filter:blur(8px);padding:12px 16px;display:flex;align-items:center;gap:12px;padding-top:calc(12px + env(safe-area-inset-top))}
header img{height:30px}
header .tt{font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{background:none;border:none;color:var(--ink);font-size:22px;line-height:1;padding:4px 8px}
.bell{position:relative;background:none;border:none;font-size:20px;color:var(--ink)}
.bell .bdg{position:absolute;top:-4px;right:-6px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px}
nav{position:fixed;top:0;left:-260px;width:250px;height:100vh;height:100dvh;background:#101010;z-index:40;transition:left .25s;padding:calc(16px + env(safe-area-inset-top)) 12px 16px;overflow-y:auto}
nav.open{left:0}
nav .who{font-size:13px;color:var(--mut);padding:8px 10px 14px;border-bottom:1px solid #262626;margin-bottom:8px}
nav button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:11px 12px;border-radius:10px;font-size:14px}
nav button.on{background:#262626;color:var(--acc)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
main{padding:16px;padding-bottom:80px}
h1.pg{font-size:19px;margin-bottom:14px}
/* ---------- componentes ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border-radius:16px;padding:18px 14px;text-align:center;font-size:14px;font-weight:600;border:none;color:var(--ink);display:flex;flex-direction:column;gap:8px;align-items:center}
.tile .em{font-size:28px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:14px;padding:14px}
.kpi .v{font-size:22px;font-weight:800;color:var(--acc)}
.kpi .l{font-size:11px;color:var(--mut);margin-top:3px}
.tblwrap{overflow-x:auto;background:var(--card);border-radius:14px;padding:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid #2c2c2c;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #242424;vertical-align:top}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
#modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
#modal-wrap.open{display:flex}
#modal{background:var(--card,#1e1e1e);border:1px solid #333;border-radius:14px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;padding:18px}
#modal h3{margin:0 0 12px;font-size:16px}
#modal label{font-size:11px;color:var(--mut);margin:10px 0 4px;display:block}
#modal input,#modal select,#modal textarea{width:100%;background:var(--field);color:var(--ink);border:1px solid #333;border-radius:8px;padding:9px 10px;font-size:13px}
#modal .mrow{display:flex;gap:8px;margin-top:14px}
#modal .mrow .btn{flex:1}
.fotobtns{display:flex;gap:10px;margin:6px 0 2px}
.fotobtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;background:var(--field);border:2px dashed #444;border-radius:12px;color:var(--ink);cursor:pointer;text-align:center}
.fotobtn:active{border-color:var(--acc)}
.fotobtn .ic{font-size:26px}
.fotobtn .tt{font-size:12px;font-weight:700}
.fotobtn .sub{font-size:10px;color:var(--mut)}
.fotoprev{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.fotoprev img{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid #333}
.tag.aberta{background:#3a2f14;color:var(--acc)}
.tag.conferencia{background:#14304a;color:#7db8e8}
.tag.fechada{background:#1c3320;color:#7fd88f}
.tag.aguardando,.tag.recebida,.tag.recebido,.tag.aguardando_ciencia{background:#3a2f14;color:var(--acc)}
.tag.aprovada,.tag.fechada,.tag.resolvida,.tag.concluida{background:#1c3320;color:#7fd88f}
.tag.reprovada{background:#3a1a1a;color:#e88}
.tag.em_analise,.tag.em_execucao,.tag.encaminhado,.tag.ciente,.tag.providencia{background:#14304a;color:#7db8e8}
.tag.aguardando_peca{background:#3a2f14;color:var(--acc)}
.tag.arquivado{background:#2a2a2a;color:#888}
.row{display:flex;gap:10px}
.row>*{flex:1}
.sec{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
.sec h3{font-size:14px;margin-bottom:10px}
.sec .hint{font-size:12px;color:var(--mut)}
.wm{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:0;opacity:.06}
.wm img{width:min(72vw,600px);filter:brightness(10)}
main>*{position:relative;z-index:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#2e2e2e;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw}
#toast.on{opacity:1}
.mhab.on{background:var(--acc);color:#111;border-color:var(--acc)}
.empty{color:var(--mut);font-size:13px;padding:18px;text-align:center}
.photo{max-width:140px;border-radius:10px;display:block;margin-top:6px}
.cfitem{border:1px solid #2c2c2c;border-radius:12px;padding:12px;margin:8px 0}
.cfitem.ok{border-color:#2e5c34;background:#1a241b}
.cfitem.no{border-color:#5c3a2e;background:#241d1a}
@media(min-width:700px){nav{position:fixed;left:0;width:230px}#scrim{display:none}main{margin-left:230px}header{margin-left:230px}}

:root{--acc-ovos:#fcc85c;--acc-transp:#1e5aa8}
.emp-btn{display:inline-flex;align-items:center;gap:6px;background:var(--field);border:1px solid #333;color:var(--ink);border-radius:18px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.emp-btn span{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dbtabs{display:flex;gap:6px;margin:2px 0 10px;overflow-x:auto}
.dbtabs button{flex:1;min-width:104px;background:var(--field);border:1px solid #333;color:var(--mut);border-radius:10px;padding:9px 6px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.dbtabs button.on{background:var(--acc);color:#111;border-color:var(--acc)}
.emp-menu{position:absolute;top:54px;right:10px;background:var(--card);border:1px solid #333;border-radius:12px;padding:6px;display:none;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.55);min-width:220px}
.emp-menu.open{display:block}
.emp-menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:10px 12px;border-radius:8px;font-size:13px;cursor:pointer}
.emp-menu button.on{background:var(--field);color:var(--acc);font-weight:700}
header{position:relative}
body[data-emp="TRANSPORTADORA"]{--acc:#1e5aa8}
body[data-emp="DISTRIBUIDORA"]{--acc:#797f35}
.logo-emp{max-width:150px;max-height:56px;object-fit:contain}
.empbar{height:3px;width:100%;background:var(--acc)}
.empchip{display:inline-flex;align-items:center;gap:6px;background:var(--field);border:1px solid #333;border-radius:20px;padding:3px 10px;font-size:11px;color:var(--mut)}
.empchip b{color:var(--acc);font-size:11px}
.seletor{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.seletor button{background:var(--field);color:var(--mut);border:1px solid #333;border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer}
.seletor button.on{background:var(--acc);color:#141414;border-color:var(--acc);font-weight:700}
.campx{margin-top:6px}
.mini-sel{background:var(--field);color:var(--ink);border:1px solid #333;border-radius:8px;padding:7px 8px;font-size:12px}
.dynrow{display:flex;gap:8px;align-items:center;margin-top:6px}
.dynrow input{flex:1}
.dynrow button{margin-top:0}
</style>
</head>
<body>
<div class="wm"><img id="lg-wm" src="logo-branca.png" alt=""></div>
<div id="login">
  <img class="logo" id="lg-login" src="logo-branca.png" alt="CASAGRANDE">
  <div class="card" id="card-login">
    <h2 id="lg-app">CASAGRANDE</h2>
    <label>Usuário</label>
    <input id="li-email" type="email" placeholder="email@casagrande" autocomplete="username">
    <label>Senha</label>
    <input id="li-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="li-btn">Entrar</button>
    <div class="msg" id="li-msg"></div>
    <div class="hint" style="font-size:11px;color:var(--mut);margin-top:8px">Conta nova passa pela aprovação da gerência</div>
    <button class="btn sec" id="li-esqueci" style="margin-top:10px">🔑 Esqueci minha senha</button>
    <button class="btn sec" id="li-cfg" style="margin-top:10px">⚙️ Configurar conexão</button>
    <div class="msg" id="cfg-msg"></div>
    <button class="btn sec" id="li-criar" style="margin-top:10px">➕ Criar conta (equipe)</button>
  </div>
  <div class="card hide" id="card-criar">
    <h2>Criar conta</h2>
    <label>Seu nome</label><input id="cr-nome" placeholder="nome completo">
    <label>Email</label><input id="cr-email" type="email" autocomplete="username">
    <label>Senha (mín. 6)</label><input id="cr-pass" type="password" autocomplete="new-password">
    <label>CPF</label><input id="cr-cpf" inputmode="numeric" placeholder="000.000.000-00">
    <label>CNH</label><input id="cr-cnh" inputmode="numeric" placeholder="nº da CNH">
    <div class="row"><div><label>Categoria</label><input id="cr-cat" placeholder="D / E"></div><div><label>Validade da CNH</label><input id="cr-val" type="date"></div></div>
    <label>Contato (WhatsApp)</label><input id="cr-cont" inputmode="tel" placeholder="(19) 99999-9999">
    <p class="hint" style="margin:6px 0 0">A gerência confere esses dados na hora de liberar seu acesso.</p>
    <button class="btn" id="cr-btn">Criar minha conta</button>
    <div class="msg" id="cr-msg"></div>
    <button class="btn sec" id="cr-voltar" style="margin-top:10px">← Voltar para o login</button>
  </div>
  <div class="card hide" id="card-redef">
    <h2>Nova senha</h2>
    <label>Nova senha (mín. 6)</label><input id="rd-p1" type="password" autocomplete="new-password">
    <label>Confirmar nova senha</label><input id="rd-p2" type="password" autocomplete="new-password">
    <button class="btn" id="rd-btn">Salvar nova senha</button>
    <div class="msg" id="rd-msg"></div>
    <button class="btn sec" id="rd-voltar" style="margin-top:10px">← Voltar para o login</button>
  </div>
</div>
<div id="modal-wrap"><div id="modal"></div></div>
<div id="app" class="hide">
  <header>
    <button class="burger" id="burger">☰</button>
    <img id="lg-head" src="logo-branca.png" alt="">
    <div class="tt" id="pg-title">Início</div>
    <button class="emp-btn" id="emp-btn" style="margin-right:6px"></button>
    <button class="bell" id="bell">🔔<span class="bdg hide" id="bdg">0</span></button>
  </header>
  <div class="emp-menu" id="emp-menu"></div>
  <div id="scrim" class="hide"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>

function empAtiva(){return window.__EMP||'OVOS'}
function setEmp(e){
  if(window.__empTravada&&e!==window.__empTravada){
    toast('Você tem jornada aberta na '+(EMPNOME[window.__empTravada]||window.__empTravada)+' — finalize para trocar de empresa');
    return;
  }
  window.__EMP=e;applyBranding();buildNav();applyEmpBtn();bindEmpMenu();
  if(!NAV.includes(PAGE)){go('home');toast('Você está em '+(EMPNOME[e]||'GRUPO'))}
  else{go(PAGE)}
}
function applyBranding(){
  const e=empAtiva();
  document.body.dataset.emp=e;
  const lg=EMPLOGO[e]||'logo-branca.png';
  ['lg-login','lg-head','lg-wm'].forEach(id=>{const el=document.getElementById(id);if(el)el.src=lg});
  const h2=document.getElementById('lg-app');if(h2)h2.textContent=EMPNOME[e];
  applyEmpBtn();
}
function empChip(){const e=empAtiva();return `<div class="empchip">🏢 <b>${esc(EMPNOME[e])}</b></div>`}
function applyEmpBtn(){
  const b=document.getElementById('emp-btn');if(!b)return;
  if(!ME||!['AMBAS','TODAS'].includes(ME.empresa)){b.style.display='none';return}
  const e=empAtiva();
  const cor=e==='TRANSPORTADORA'?'#1e5aa8':e==='DISTRIBUIDORA'?'#797f35':e==='GRUPO'?'#9a9a9a':'#fcc85c';
  const nome=e==='TRANSPORTADORA'?'TRANSPORTADORA':e==='DISTRIBUIDORA'?'DISTRIBUIDORA':e==='GRUPO'?'GRUPO':'OVOS';
  b.style.display='';
  if(window.__empTravada){
    b.innerHTML=`<span style="background:${cor}"></span>${nome} 🔒`;
    b.title='Jornada aberta nesta empresa — finalize para trocar';
    return;
  }
  b.innerHTML=`<span style="background:${cor}"></span>${nome} ▾`;
}
function bindEmpMenu(){
  const b=document.getElementById('emp-btn'),m=document.getElementById('emp-menu');
  if(!b||!m)return;
  if(!ME||!['AMBAS','TODAS'].includes(ME.empresa)){b.style.display='none';m.classList.remove('open');return}
  if(window.__empTravada){
    m.classList.remove('open');
    b.onclick=()=>{toast('Você tem jornada aberta na '+(EMPNOME[window.__empTravada]||window.__empTravada)+' — finalize a jornada para trocar de empresa')};
    return;
  }
  const opts=ME.empresa==='TODAS'?[['OVOS','🥚 OVOS CASAGRANDE'],['TRANSPORTADORA','🚚 TRANSPORTADORA'],['DISTRIBUIDORA','🏪 DISTRIBUIDORA'],['GRUPO','Σ GRUPO — as três']]:[['OVOS','🥚 OVOS CASAGRANDE'],['TRANSPORTADORA','🚚 TRANSPORTADORA'],['GRUPO','Σ GRUPO — as duas']];
  m.innerHTML=opts.map(o=>`<button data-e="${o[0]}" class="${empAtiva()===o[0]?'on':''}">${o[1]}</button>`).join('');
  m.querySelectorAll('button').forEach(x=>x.onclick=()=>{m.classList.remove('open');setEmp(x.dataset.e)});
  b.onclick=ev=>{ev.stopPropagation();m.classList.toggle('open')};
}
document.addEventListener('click',ev=>{
  const m=document.getElementById('emp-menu');
  if(m&&m.classList.contains('open')&&!m.contains(ev.target)){const b=document.getElementById('emp-btn');if(!b||!b.contains(ev.target))m.classList.remove('open')}
});
function empFilter(q){const e=empAtiva();if(e==='GRUPO'||!ME)return q;return q.in('empresa',[e,'AMBAS'])}
function insEmp(row){const e=empAtiva();if(e&&e!=='GRUPO')row.empresa=e;return row}
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function placaLimpa(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8)}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2600)}
function fmt(v){return v==null||v===''?'—':v}
function fmtD(d){if(!d)return'—';const x=new Date(d);return x.toLocaleDateString('pt-BR')}
function fmtDT(d){if(!d)return'—';const x=new Date(d);return x.toLocaleDateString('pt-BR')+' '+x.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function pedirTexto(titulo,label,valor=''){
  return new Promise(res=>{
    openModal(titulo,[{id:'pt-val',label:label,tipo:'textarea',valor:valor}],async v=>{
      if(!v['pt-val']||!v['pt-val'].trim()){toast('Informe o motivo');return false}
      res(v['pt-val'].trim());return true;
    });
    const oldCancel=document.getElementById('m-cancel').onclick;
    document.getElementById('m-cancel').onclick=()=>{document.getElementById('modal-wrap').classList.remove('open');res(null)};
  });
}
function openModal(titulo,campos,aoSalvar){
  const w=document.getElementById('modal-wrap'),m=document.getElementById('modal');
  m.innerHTML=`<h3>${esc(titulo)}</h3>`+campos.map(f=>{
    let inp;

function menusPara(){
  const base={
    pendente:['home'],
    gerencia:['home','hoje','manuais','promotoria','relatorios','veiculos','motoristas','jornadas','conferencia','abastecimentos','despesas','recebimentos','avisos','os','multas','tipos','usuarios','auditoria'],

    promotor:['home','manuais','pro-roteiro','pro-avulsa','jornada','gastos','meu-historico','avisos','multas'],
    conferente:['home','manuais','jornadas','conferencia','despesas','recebimentos','avisos','multas'],
    mecanico:['home','manuais','os']
  };
  let m=(base[ME.perfil]||base.gerencia).slice();
  const e=empAtiva();
  if(e==='DISTRIBUIDORA'){
    if(ME.perfil==='gerencia')m=['home','hoje','rotas','clientes','produtos','tipos','veiculos','motoristas','jornadas','abastecimentos','despesas','avisos','multas','manuais','usuarios','auditoria'];
    else if(ME.perfil==='motorista')m=['home','minha-rota','jornada','gastos','meu-historico','avisos','multas','manuais'];
    else m=m.filter(x=>!['promotoria','pro-roteiro','pro-avulsa','conferencia','recebimentos','recnovo','pro-cliente'].includes(x));
  }
  if(ME.perfil==='gerencia'&&ME.motorista){
    const ex=ME.extra||[];
    if(ex.includes('motorista')&&!m.includes('jornada'))m.push('jornada','gastos');
    if(ex.includes('promotor')&&!m.includes('pro-roteiro'))m.push('pro-roteiro','pro-avulsa');
    if((ex.includes('motorista')||ex.includes('promotor'))&&!m.includes('meu-historico'))m.push('meu-historico');
  }
  if(e!=='OVOS'&&ME.perfil!=='gerencia')m=m.filter(x=>x!=='pro-roteiro'&&x!=='promotoria'&&x!=='pro-avulsa');
  if(e==='TRANSPORTADORA')m=m.filter(x=>x!=='conferencia');
  if(e==='OVOS')m=m.filter(x=>x!=='recebimentos');
  if(ME.perfil==='motorista'&&e==='OVOS')m=m.filter(x=>x!=='recnovo');
  if(ME.perfil==='conferente')m=m.filter(x=>e!=='TRANSPORTADORA'||x!=='conferencia');
  return m;
}

/* ============ fila offline (lançamentos sem sinal) ============ */
const FILA_KEY='cg_fila_offline';
function filaLer(){try{return JSON.parse(localStorage.getItem(FILA_KEY)||'[]')}catch(e){return[]}}
function filaSalvar(f){try{localStorage.setItem(FILA_KEY,JSON.stringify(f))}catch(e){}}
function atualizaBadgeOffline(){const n=filaLer().length;const b=document.getElementById('off-badge');if(!b)return;b.classList.toggle('hide',!n);b.textContent=n?('📴 '+n):''}
function filaAdd(op){const f=filaLer();f.push(Object.assign({em:new Date().toISOString()},op));filaSalvar(f);atualizaBadgeOffline();toast('📴 Sem sinal — salvo no aparelho, envia sozinho quando voltar')}
async function filaProcessa(){
  const f=filaLer();
  if(!f.length||!navigator.onLine)return;
  const rest=[];
  for(const it of f){
    try{
      const row=Object.assign({},it.row||{});
      for(const k of Object.keys(row)){
        if(typeof row[k]==='string'&&row[k].startsWith('OFFLINE:')){
          const b64=row[k].slice(8);
          const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
          const path=(ME&&ME.id?ME.id:'anon')+'/offline-'+Date.now()+'.jpg';
          const up=await sb.storage.from('fotos').upload(path,new Blob([bin]),{upsert:true,contentType:'image/jpeg'});
          if(up.error)throw new Error('foto: '+up.error.message);
          row[k]=path;
        }
      }
      let r;
      if(it.tipo==='upd')r=await sb.from(it.table).update(row).eq('id',it.id);
      else r=await sb.from(it.table).insert(row);
      if(r.error)rest.push(it);
    }catch(e){rest.push(it)}
  }
  filaSalvar(rest);atualizaBadgeOffline();
}
window.addEventListener('online',filaProcessa);

async function uploadFoto(file,path){
  if(!file)return null;
  if(file.size>8*1024*1024){toast('Foto muito grande (máx 8 MB)');return null}
  const comp=await comprimir(file);
  if(!navigator.onLine){
    // offline: devolve o conteúdo para guardar na fila (envia quando o sinal voltar)
    const b64=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>res(null);r.readAsDataURL(comp)});
    if(b64)return 'OFFLINE:'+b64;
    return null;
  }
  const {error}=await sb.storage.from('fotos').upload(path,comp,{upsert:true,contentType:comp.type});
  if(error){toast('Erro ao enviar foto: '+err(error));return null}
  return path;

async function comprimir(file){
  if(!file.type.startsWith('image/'))return file;
  try{
    const bmp=await createImageBitmap(file);
    const max=1200;let{width:w,height:h}=bmp;
    if(w>max||h>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(bmp,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.7));
    return blob&&blob.size<file.size?new File([blob],(file.name||'foto.jpg').replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'}):file;
  }catch(e){return file}
}

/* máscara/parse de números BR: aceita 1.234,56 e 1234.56 */
function parseBR(v){if(v==null)return 0;v=String(v).trim();if(!v)return 0;v=v.replace(/\s/g,'');if(v.includes(',')){v=v.replace(/\./g,'').replace(',','.')}return parseFloat(v)||0}
function fmtBR2(n){return (Math.round(n*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:3})}
function fmtKm(n){return n==null?'—':Number(n).toLocaleString('pt-BR')}

    jornadas:()=>J.length?`<div class="sec"><h3>Todas (30 dias)</h3><div class="tblwrap"><table><tr><th>Saída</th><th>Veículo</th><th>Roteiro</th><th>Km</th><th>Status</th></tr>
    ${J.map(j=>`<tr><td>${fmtDT(j.inicio)}</td><td>${esc(j.veiculos?.placa||'')}</td><td>${rotTxt(j)}</td><td>${km(j.km_inicial)}${j.km_final!=null?' → '+km(j.km_final):''}</td><td>${tag(j.status)}</td></tr>`).join('')}</table></div></div>`:empty('Nenhuma jornada nos últimos 30 dias'),

    ${A.slice(0,30).map(x=>`<tr><td>${fmtDT(x.data)}</td><td>${esc(x.posto||'—')}</td><td>${esc(x.combustivel||'')}</td><td>${x.litros}</td><td>${fmtBRL(x.valor_total)}</td></tr>`).join('')}</table></div>
    <h3 style="margin-top:12px">Outros gastos (${D.length})</h3><div class="tblwrap"><table><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Valor</th><th>Status</th></tr>

    avisos:()=> AV.length?`<div class="sec"><h3>Meus avisos (30 dias)</h3>${AV.map(a=>`

/* ============ MANUAIS (só gerência) ============ */
PAGES.manuais=async el=>{
  const ehGer=ME.perfil==='gerencia';
  el.innerHTML=`<h1 class="pg">📘 Manuais</h1>
  ${ehGer?`<div class="sec"><h3>Enviar manual (PDF)</h3>
    <input type="file" id="mn-arq" accept="application/pdf" style="width:100%">
    <input id="mn-nome" placeholder="Nome do manual — comece com o perfil (ex.: motorista - Manual do motorista)" style="width:100%;margin-top:6px">
    <p class="hint" style="margin:6px 0 0">Quem vê o quê: nome com "motorista" → motoristas e promotores · "conferente" → conferentes · "mecanico" → mecânicos · "gerente" ou "promotoria" → só gerência · sem palavra de perfil → todos.</p>
    <button class="btn" id="mn-btn" style="margin-top:8px">📤 Enviar</button><div class="msg" id="mn-msg"></div></div>`:''}
  <div id="mn-lista">${empty('Carregando…')}</div>`;
  const alvo=ME.perfil;
  const visivelPara=f=>{
    const n=f.name.toLowerCase();
    if(n.includes('gerente')||n.includes('promotoria'))return alvo==='gerencia';
    if(n.includes('motorista'))return ['motorista','promotor','gerencia'].includes(alvo);
    if(n.includes('conferente'))return ['conferente','gerencia'].includes(alvo);
    if(n.includes('mecanico')||n.includes('mecânico'))return ['mecanico','gerencia'].includes(alvo);
    return true;
  };
  const carregar=async()=>{
    const {data:list}=await sb.storage.from('manuais').list('',{limit:50,sortBy:{column:'created_at',order:'desc'}});
    const l=$('mn-lista');
    const meus=(list||[]).filter(visivelPara);
    if(!meus.length){l.innerHTML=empty('Nenhum manual para você ainda');return}
    l.innerHTML=`<div class="sec"><h3>Meus manuais (${meus.length})</h3>${meus.map(f=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #242424">
        <span style="font-size:13px">📄 ${esc(f.name.replace(/\.pdf$/i,''))}</span>
        <button class="btn mini" data-dl="${esc(f.name)}">⬇️ Abrir</button></div>`).join('')}</div>`;
    l.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{
      const {data}=await sb.storage.from('manuais').createSignedUrl(b.dataset.dl,300,{download:true});
      if(data)window.open(data.signedUrl,'_blank');else toast('Não consegui abrir o arquivo');
    });
  };
  if(ehGer){
    $('mn-btn').onclick=async()=>{
      const file=$('mn-arq').files[0];
      if(!file){$('mn-msg').className='msg err';$('mn-msg').textContent='Escolha o PDF';return}
      const nome=($('mn-nome').value||file.name.replace(/\.pdf$/i,'')).trim();
      const path=`${nome}.pdf`;
      const {error}=await sb.storage.from('manuais').upload(path,file,{upsert:true,contentType:'application/pdf'});
      if(error){$('mn-msg').className='msg err';$('mn-msg').textContent=err(error);return}
      $('mn-msg').className='msg ok';$('mn-msg').textContent='Manual enviado ✓';
      carregar();
    };
  }
  carregar();
};

      if(!nome){m.className='msg err';m.textContent='Digite o nome do cliente';return}
      m.className='msg';m.textContent='Pegando GPS...';
      navigator.geolocation.getCurrentPosition(async pos=>{

};
PAGES['pro-avulsa-visita']=async el=>{
  const cid=window.__avulsaCliente;
  el.innerHTML=`<h1 class="pg">Visita avulsa</h1><div id="pc">${empty('Carregando…')}</div>`;
  const {data:c}=await sb.from('clientes_promotoria').select('*').eq('id',cid).maybeSingle();
  if(!c){$('pc').innerHTML=empty('Cliente não encontrado');return}
  $('pc').innerHTML=`
  <div class="sec"><span class="tag conferencia">🚶 visita avulsa — sem roteiro</span>
    <b style="font-size:16px;display:block;margin-top:8px">${esc(c.nome)}</b><div class="hint">${esc(c.endereco||'')}</div>
    <div id="pc-gps" style="margin-top:10px"><button class="btn" id="pc-gpsbtn">📍 Conferir localização</button><div class="msg" id="pc-gpsmsg"></div></div></div>
  <div class="sec" id="pc-fotos-sec" style="display:none"><h3>Fotos da loja (mínimo 3)</h3>

    <div class="fotobtns" style="margin-top:8px">
      <label class="fotobtn" for="pc-cam">📷<span class="ic"></span><span class="tt">Tirar foto</span><span class="sub">usar a câmera</span></label>
      <label class="fotobtn" for="pc-gal">🖼️<span class="ic"></span><span class="tt">Enviar foto</span><span class="sub">da galeria</span></label>
    </div>
    <input type="file" id="pc-cam" accept="image/*" capture="environment" hidden><input type="file" id="pc-gal" accept="image/*" hidden>
    <div class="hint" id="pc-fcount" style="margin-top:6px"></div></div>
  <div class="sec" id="pc-ped-sec" style="display:none"><h3>Pedido ou observação</h3>
    <textarea id="pc-ped" rows="3" placeholder="ex.: pediu 10 caixas de extra para sexta"></textarea></div>
  <div class="sec" id="pc-fin-sec" style="display:none"><button class="btn" id="pc-fin">✓ Concluir visita avulsa</button><div class="msg" id="pc-msg"></div></div>`;
  const estado={gps:null,fotos:[]};
  $('pc-gpsbtn').onclick=()=>{
    $('pc-gpsmsg').className='msg';$('pc-gpsmsg').textContent='Pegando GPS…';
    navigator.geolocation.getCurrentPosition(pos=>{
      const lat=pos.coords.latitude,lon=pos.coords.longitude;
      let dist=null;
      if(c.latitude!=null&&c.longitude!=null){
        const R=6371000,dLat=(lat-c.latitude)*Math.PI/180,dLon=(lon-c.longitude)*Math.PI/180;
        const a=Math.sin(dLat/2)**2+Math.cos(c.latitude*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLon/2)**2;
        dist=Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
      }
      if(dist==null||(dist<=200)){estado.gps={ok:true,dist};gpsOk(dist!=null?('Localização confirmada ✓ ('+dist+' m)'):null)}
      else{
        estado.gps={ok:false,dist};
        $('pc-gpsmsg').className='msg err';$('pc-gpsmsg').textContent='Você está a '+dist+' m do ponto cadastrado';
        const w=document.getElementById('modal-wrap'),mm=document.getElementById('modal');
        mm.innerHTML=`<h3>📍 Longe do ponto cadastrado</h3><p style="font-size:13px;color:#dddddd">Confirma a visita mesmo assim? Escreva o motivo.</p><label>Motivo *</label><textarea id="gj-just" rows="2" style="width:100%"></textarea><div class="mrow"><button class="btn sec" id="m-cancel">Voltar</button><button class="btn" id="gj-ok">Confirmar visita</button></div>`;
        w.classList.add('open');w.onclick=e=>{if(e.target===w)w.classList.remove('open')};
        document.getElementById('m-cancel').onclick=()=>w.classList.remove('open');
        document.getElementById('gj-ok').onclick=()=>{
          const j=(document.getElementById('gj-just').value||'').trim();
          if(!j){toast('Escreva o motivo');return}
          estado.gps={ok:false,dist,just:j};w.classList.remove('open');gpsOk('Visita confirmada com justificativa');
        };
      }
    },()=>{
      $('pc-gpsmsg').className='msg err';$('pc-gpsmsg').textContent='Não consegui pegar o GPS';
      const w=document.getElementById('modal-wrap'),mm=document.getElementById('modal');
      mm.innerHTML=`<h3>📍 GPS não disponível</h3><p style="font-size:13px;color:#dddddd">Confirma a visita sem GPS? A gerência fica sabendo.</p><div class="mrow"><button class="btn sec" id="m-cancel">Voltar</button><button class="btn" id="gj-ok">Confirmar sem GPS</button></div>`;
      w.classList.add('open');w.onclick=e=>{if(e.target===w)w.classList.remove('open')};
      document.getElementById('m-cancel').onclick=()=>w.classList.remove('open');
      document.getElementById('gj-ok').onclick=()=>{estado.gps={ok:null,dist:null,just:'sem GPS'};w.classList.remove('open');gpsOk('Visita confirmada (sem GPS)')};
    },{enableHighAccuracy:true,timeout:15000});
  };
  const gpsOk=(msg)=>{$('pc-gpsmsg').className='msg ok';$('pc-gpsmsg').textContent=msg||'Localização confirmada ✓';
    $('pc-fotos-sec').style.display='';$('pc-ped-sec').style.display='';$('pc-fin-sec').style.display='';renderFotos()};
  const renderFotos=()=>{
    $('pc-fotos').innerHTML=estado.fotos.map((f,i)=>`<div style="position:relative;width:86px;height:86px"><img src="${f.url}" style="width:86px;height:86px;object-fit:cover;border-radius:10px"><button data-rm="${i}" style="position:absolute;top:-6px;right:-6px;background:#8b3a3a;color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:12px">✕</button></div>`).join('');
    $('pc-fcount').textContent=estado.fotos.length+' foto(s)'+(estado.fotos.length<3?` — faltam ${3-estado.fotos.length}`:' ✓');
    $('pc-fotos').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{estado.fotos.splice(+b.dataset.rm,1);renderFotos()});
  };
  const addFoto=async file=>{
    if(!file)return;
    if(estado.fotos.length>=10){toast('Máximo de 10 fotos');return}
    const path=`${ME.id}/promotoria-${Date.now()}-${estado.fotos.length}.jpg`;

    const url=await assinar(p,'fotos');
    estado.fotos.push({path,url});renderFotos();
  };
  $('pc-cam').onchange=e=>addFoto(e.target.files[0]);
  $('pc-gal').onchange=e=>addFoto(e.target.files[0]);
  $('pc-fin').onclick=async()=>{
    if(estado.fotos.length<3){$('pc-msg').className='msg err';$('pc-msg').textContent='São necessárias pelo menos 3 fotos';return}
    const {error}=await sb.from('visitas').insert({roteiro_id:null,cliente_id:cid,promotor_id:ME.motorista.id,gps_ok:estado.gps.ok,distancia_m:estado.gps.dist,justificativa:estado.gps.just||null,fotos:estado.fotos.map(f=>f.path),pedido:$('pc-ped').value||null,visitado_em:new Date().toISOString()});
    if(error){$('pc-msg').className='msg err';$('pc-msg').textContent=err(error);return}

function novoClienteUI(recarregar){

    <div id="nc-map" style="height:220px;border-radius:10px;border:1px solid #333;margin-top:4px"></div>
    <div class="hint" id="nc-coord" style="margin:6px 0 0">Toque no mapa para marcar o ponto da loja</div>
    <div class="msg err" id="nc-msg" style="display:none"></div>
    <div class="mrow"><button class="btn sec" id="m-cancel">Cancelar</button><button class="btn" id="nc-ok">Cadastrar</button></div>`;

  document.getElementById('m-cancel').onclick=()=>w.classList.remove('open');

  const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);
  const js=document.createElement('script');js.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  js.onload=()=>{
    const map=L.map('nc-map').setView([-22.9068,-47.0616],13); // Campinas/SP
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
    let marker=null;
    map.on('click',e=>{
      if(marker)map.removeLayer(marker);
      marker=L.marker([e.latlng.lat,e.latlng.lng]).addTo(map);
      window.__ncLat=e.latlng.lat;window.__ncLon=e.latlng.lng;
      document.getElementById('nc-coord').textContent='Ponto marcado ✓ ('+e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5)+')';
    });
    setTimeout(()=>map.invalidateSize(),300);
  };
  document.head.appendChild(js);
  document.getElementById('nc-ok').onclick=async()=>{
    const m=document.getElementById('nc-msg');
    const nome=(document.getElementById('nc-nome').value||'').trim().toUpperCase();
    if(!nome){m.style.display='block';m.textContent='Digite o nome do cliente';return}
    if(window.__ncLat==null){m.style.display='block';m.textContent='Toque no mapa para marcar a localização da loja';return}
    const {data,error}=await sb.from('clientes_promotoria').insert({
      nome,endereco:document.getElementById('nc-end').value||null,
      cnpj:document.getElementById('nc-cnpj').value||null,
      latitude:window.__ncLat,longitude:window.__ncLon
    }).select().single();
    if(error){m.style.display='block';m.textContent=err(error);return}
    w.classList.remove('open');toast('Cliente cadastrado: '+nome);recarregar&&recarregar();
  };
}

function criarRoteiroUI(recarregar){
  const w=document.getElementById('modal-wrap'),mm=document.getElementById('modal');
  mm.innerHTML=`<h3>➕ Criar roteiro(s)</h3>
    <label>Datas (pode escolher vários dias)</label>
    <input id="nr-data" type="date" style="width:100%;margin-bottom:6px">
    <div id="nr-datas" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"></div>
    <label>Promotor *</label><select id="nr-prom" style="width:100%"><option value="">Carregando…</option></select>
    <label style="margin-top:10px">Clientes do roteiro *</label>
    <div id="nr-clis" style="max-height:220px;overflow-y:auto;border:1px solid #333;border-radius:10px;padding:6px"></div>
    <div class="hint" id="nr-cont" style="margin:6px 0 0"></div>
    <div class="msg err" id="nr-msg" style="display:none"></div>
    <div class="mrow"><button class="btn sec" id="m-cancel">Cancelar</button><button class="btn" id="nr-ok">Criar</button></div>`;
  w.classList.add('open');w.onclick=e=>{if(e.target===w)w.classList.remove('open')};
  document.getElementById('m-cancel').onclick=()=>w.classList.remove('open');
  const datas=[];
  const renderDatas=()=>{
    document.getElementById('nr-datas').innerHTML=datas.map((d,i)=>`<span style="background:var(--field);border:1px solid #333;border-radius:16px;padding:4px 10px;font-size:12px">${d.slice(8,10)}/${d.slice(5,7)} <b style="cursor:pointer;color:#e88" data-rd="${i}">✕</b></span>`).join('');
    document.getElementById('nr-datas').querySelectorAll('[data-rd]').forEach(x=>x.onclick=()=>{datas.splice(+x.dataset.rd,1);renderDatas()});
  };
  document.getElementById('nr-data').onchange=e=>{
    const d=e.target.value;if(!d)return;
    if(!datas.includes(d))datas.push(d);
    datas.sort();renderDatas();e.target.value='';
  };
  (async()=>{
    const {data:pro}=await sb.from('motoristas').select('id,nome,ativo').order('nome');
    document.getElementById('nr-prom').innerHTML='<option value="">— escolha o promotor —</option>'+(pro||[]).filter(x=>x.ativo).map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('');
    const {data:clis}=await sb.from('clientes_promotoria').select('id,nome,endereco').eq('ativo',true).order('nome');
    const sel=new Set();
    const renderClis=()=>{
      document.getElementById('nr-clis').innerHTML=(clis||[]).map(c=>`
        <label style="display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #242424;cursor:pointer">
          <input type="checkbox" data-c="${c.id}" style="width:18px;height:18px;accent-color:var(--acc)">
          <span style="font-size:13px"><b>${esc(c.nome)}</b><div class="hint">${esc(c.endereco||'')}</div></span></label>`).join('')||'<p class="hint">Nenhum cliente cadastrado ainda.</p>';
      document.getElementById('nr-clis').querySelectorAll('input[data-c]').forEach(cb=>cb.onchange=()=>{
        if(cb.checked)sel.add(cb.dataset.c);else sel.delete(cb.dataset.c);
        document.getElementById('nr-cont').textContent=sel.size+' cliente(s) selecionado(s)';
      });
    };
    renderClis();
    document.getElementById('nr-ok').onclick=async()=>{
      const m=document.getElementById('nr-msg');
      const prom=document.getElementById('nr-prom').value;
      if(!datas.length){m.style.display='block';m.textContent='Escolha pelo menos uma data';return}
      if(!prom){m.style.display='block';m.textContent='Escolha o promotor';return}
      if(!sel.size){m.style.display='block';m.textContent='Selecione os clientes';return}
      let criados=0;
      for(const d of datas){
        const {data:r}=await sb.from('roteiros_promotoria').insert({data:d,promotor_id:prom,criado_por:ME.id}).select().single();
        if(!r)continue;
        let ordem=1;
        for(const cid of sel){
          await sb.from('roteiro_clientes').insert({roteiro_id:r.id,cliente_id:cid,ordem:ordem++});
        }
        criados++;
      }
      w.classList.remove('open');
      toast(criados?criados+' roteiro(s) criado(s)':'Não consegui criar — já existe roteiro desse promotor nesse dia?');
      recarregar&&recarregar();
    };
  })();
}

        ${v?'<span style="font-size:22px">✅</span>':`<button class="btn mini" data-vis="${c.cliente_id}">Visitar</button>`}

PAGES['pro-cliente']=async el=>{
  const cid=window.__clienteVis,rid=window.__roteiroVis;
  el.innerHTML=`<h1 class="pg">Visita ao cliente</h1><div id="pc">${empty('Carregando…')}</div>`;
  const {data:c}=await sb.from('clientes_promotoria').select('*').eq('id',cid).maybeSingle();
  if(!c){$('pc').innerHTML=empty('Cliente não encontrado');return}
  $('pc').innerHTML=`
  <div class="sec"><b style="font-size:16px">${esc(c.nome)}</b><div class="hint">${esc(c.endereco||'')}${c.cnpj?' · CNPJ '+esc(c.cnpj):''}</div>
    <div id="pc-gps" style="margin-top:10px"><button class="btn" id="pc-gpsbtn">📍 Conferir localização</button><div class="msg" id="pc-gpsmsg"></div></div></div>
  <div class="sec" id="pc-fotos-sec" style="display:none"><h3>Fotos da loja (mínimo 3)</h3>

      <label class="fotobtn" for="pc-cam">📷<span class="ic"></span><span class="tt">Tirar foto</span><span class="sub">usar a câmera</span></label>
      <label class="fotobtn" for="pc-gal">🖼️<span class="ic"></span><span class="tt">Enviar foto</span><span class="sub">da galeria</span></label>
    </div>
    <input type="file" id="pc-cam" accept="image/*" capture="environment" hidden><input type="file" id="pc-gal" accept="image/*" hidden>
    <div class="hint" id="pc-fcount" style="margin-top:6px"></div></div>
  <div class="sec" id="pc-ped-sec" style="display:none"><h3>Pedido ou observação</h3>
    <textarea id="pc-ped" rows="3" placeholder="ex.: pediu 10 caixas de extra para sexta"></textarea></div>
  <div class="sec" id="pc-fin-sec" style="display:none"><button class="btn" id="pc-fin">✓ Concluir visita</button><div class="msg" id="pc-msg"></div></div>`;
  const estado={gps:null,fotos:[]};
  $('pc-gpsbtn').onclick=()=>{
    $('pc-gpsmsg').className='msg';$('pc-gpsmsg').textContent='Pegando GPS…';
    if(!navigator.geolocation){$('pc-gpsmsg').className='msg err';$('pc-gpsmsg').textContent='Este aparelho não tem GPS';return}
    navigator.geolocation.getCurrentPosition(async pos=>{
      const lat=pos.coords.latitude,lon=pos.coords.longitude;
      let dist=null;
      if(c.latitude!=null&&c.longitude!=null){
        const R=6371000,dLat=(lat-c.latitude)*Math.PI/180,dLon=(lon-c.longitude)*Math.PI/180;
        const a=Math.sin(dLat/2)**2+Math.cos(c.latitude*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLon/2)**2;
        dist=Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
      }
      if(dist==null){
        estado.gps={ok:true,dist:null};gpsOk();
      }else if(dist<=200){
        estado.gps={ok:true,dist};gpsOk('Localização confirmada ✓ ('+dist+' m do ponto cadastrado)');
      }else{
        estado.gps={ok:false,dist};
        $('pc-gpsmsg').className='msg err';
        $('pc-gpsmsg').textContent='Você está a '+dist+' m do ponto cadastrado';
        const w=document.getElementById('modal-wrap'),mm=document.getElementById('modal');
        mm.innerHTML=`<h3>📍 Longe do ponto cadastrado</h3><p style="font-size:13px;color:#dddddd">Está a <b>${dist} m</b> do ponto salvo para este cliente. Confirma a visita mesmo assim? Escreva o motivo (ex.: loja mudou de endereço).</p>
        <label>Motivo *</label><textarea id="gj-just" rows="2" style="width:100%"></textarea><div class="mrow"><button class="btn sec" id="m-cancel">Voltar</button><button class="btn" id="gj-ok">Confirmar visita</button></div>`;

        document.getElementById('m-cancel').onclick=()=>w.classList.remove('open');
        document.getElementById('gj-ok').onclick=()=>{
          const j=(document.getElementById('gj-just').value||'').trim();
          if(!j){toast('Escreva o motivo');return}
          estado.gps={ok:false,dist,just:j};w.classList.remove('open');gpsOk('Visita confirmada com justificativa (registrada para a gerência)');
        };
      }
    },()=>{
      $('pc-gpsmsg').className='msg err';$('pc-gpsmsg').textContent='Não consegui pegar o GPS';
      const w=document.getElementById('modal-wrap'),mm=document.getElementById('modal');
      mm.innerHTML=`<h3>📍 GPS não disponível</h3><p style="font-size:13px;color:#dddddd">Confirma a visita sem GPS? A visita fica marcada como "sem GPS" para a gerência.</p><div class="mrow"><button class="btn sec" id="m-cancel">Voltar</button><button class="btn" id="gj-ok">Confirmar sem GPS</button></div>`;
      w.classList.add('open');w.onclick=e=>{if(e.target===w)w.classList.remove('open')};
      document.getElementById('m-cancel').onclick=()=>w.classList.remove('open');
      document.getElementById('gj-ok').onclick=()=>{estado.gps={ok:null,dist:null,just:'sem GPS'};w.classList.remove('open');gpsOk('Visita confirmada (sem GPS — gerência avisada)')};
    },{enableHighAccuracy:true,timeout:15000});
  };
  const gpsOk=(msg)=>{ $('pc-gpsmsg').className='msg ok';$('pc-gpsmsg').textContent=msg||'Localização confirmada ✓';
    $('pc-fotos-sec').style.display='';$('pc-ped-sec').style.display='';$('pc-fin-sec').style.display='';renderFotos();};
  const renderFotos=()=>{
    $('pc-fotos').innerHTML=estado.fotos.map((f,i)=>`<div style="position:relative;width:86px;height:86px"><img src="${f.url}" style="width:86px;height:86px;object-fit:cover;border-radius:10px"><button data-rm="${i}" style="position:absolute;top:-6px;right:-6px;background:#8b3a3a;color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:12px">✕</button></div>`).join('');
    $('pc-fcount').textContent=estado.fotos.length+' foto(s)'+(estado.fotos.length<3?` — faltam ${3-estado.fotos.length}`:' ✓');
    $('pc-fotos').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{estado.fotos.splice(+b.dataset.rm,1);renderFotos()});
  };
  const addFoto=async file=>{
    if(!file)return;
    if(estado.fotos.length>=10){toast('Máximo de 10 fotos');return}
    const path=`${ME.id}/promotoria-${Date.now()}-${estado.fotos.length}.jpg`;
    const p=await uploadFoto(file,path);if(!p)return;
    const url=await assinar(p,'fotos');
    estado.fotos.push({path,url});renderFotos();

      estado[it]={ok:true,obs:''};renderItens();atualizaProg();
    });
    iw.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{
      const it=CONF_ITENS[b.dataset.no];
      const {error}=await sb.from('jornada_conferencia').upsert({jornada_id:jid,item:it,ok:false,obs:'',conferido_por:ME.id,conferido_em:new Date().toISOString()},{onConflict:'jornada_id,item'});
      if(error){toast(err(error));return}
      estado[it]={ok:false,obs:''};renderItens();atualizaProg();
    });
    iw.querySelectorAll('[data-obs]').forEach(t=>t.addEventListener('change',async()=>{
      const it=CONF_ITENS[t.dataset.obs];
      estado[it].obs=t.value;
      const {error}=await sb.from('jornada_conferencia').upsert({jornada_id:jid,item:it,ok:false,obs:t.value,conferido_por:ME.id,conferido_em:new Date().toISOString()},{onConflict:'jornada_id,item'});
      if(error)toast(err(error));
    }));
    const nf=document.getElementById('cf-nf');
    if(nf){nf.addEventListener('input',()=>{window.__nfVal=nf.value;atualizaProg()});}
  };
  window.__nfVal=window.__nfVal||'';
  const atualizaProg=()=>{
    const ok=CONF_ITENS.filter(it=>estado[it]&&estado[it].ok===true).length;
    const no=CONF_ITENS.filter(it=>estado[it]&&estado[it].ok===false).length;
    const nfLivre=($('cf-nf')?.value||'').trim().length>0;
    $('cf-prog').textContent=`${ok}/5 conferidos${no?` · ${no} pendente(s) — fica registrado quem marcou e quando`:''}`;
    $('cf-fechar').disabled=ok<5&&!nfLivre;
    $('cf-fechar').textContent=ok<5?(nfLivre?'✓ Fechar jornada (com NF devolvida)':`Faltam ${5-ok} item(ns)`):'✓ Fechar jornada';
  };
  renderItens();atualizaProg();
  $('cf-cancelar').onclick=()=>{
    const w=document.getElementById('modal-wrap'),mm=document.getElementById('modal');
    mm.innerHTML=`<h3>🗑 Cancelar esta jornada?</h3>
      <p style="font-size:13px;color:#dddddd">A jornada de <b>${esc(j.motoristas?.nome||'')}</b> no caminhão <b>${esc(j.veiculos?.placa||'')}</b> será <b>cancelada e arquivada</b> em "jornadas canceladas". O caminhão e o motorista ficam livres na hora.</p>
      <label style="margin-top:10px">Por que está cancelando? *</label>
      <textarea id="cx-motivo" rows="3" placeholder="ex.: motorista saiu por engano / caminhão quebrou antes da rota / jornada duplicada" style="width:100%"></textarea>
      <div class="msg err" id="cx-msg" style="display:none"></div>
      <div class="mrow"><button class="btn sec" id="m-cancel">Voltar</button><button class="btn" id="m-ok" style="background:#8b3a3a">Cancelar jornada</button></div>`;
    w.classList.add('open');
    w.onclick=e=>{if(e.target===w)w.classList.remove('open')};
    document.getElementById('m-cancel').onclick=()=>w.classList.remove('open');
    document.getElementById('m-ok').onclick=async()=>{
      const motivo=(document.getElementById('cx-motivo').value||'').trim();
      if(!motivo){const m=document.getElementById('cx-msg');m.style.display='block';m.textContent='Escreva o motivo do cancelamento — é obrigatório';return}
      const r=await upd('jornadas',j.id,{status:'cancelada',motivo_cancelamento:motivo,cancelada_por:ME.id,cancelada_em:new Date().toISOString()});
      if(r){w.classList.remove('open');toast('Jornada cancelada — arquivada em canceladas');go('conferencia')}
    };
  };
  $('cf-fechar').onclick=async()=>{
    const nf=(window.__nfVal||'').trim();
    const patch={status:'fechada',conferida_por:ME.id,conferida_em:new Date().toISOString()};
    if(nf)patch.ocorrencias=(j.ocorrencias?j.ocorrencias+' | ':'')+'NF devolvida: '+nf;
    const r=await upd('jornadas',jid,patch);
    if(r){toast('Jornada fechada ✓'+(nf?' (NF devolvida registrada)':''));go('conferencia')}
  };
};

async function renderCharts(e){
  const box=document.getElementById('db-charts');if(!box)return;
  const f=x=>(x||'').slice(0,10);
  const ini='2026-10-01', fim='2026-11-30';
  const [jrn,abs,desp,rec,mlt,despP]=await Promise.all([
    empFilter(sb.from('jornadas').select('inicio,km_inicial,km_final,veiculo_id,motorista_id,status')).gte('inicio',ini).lte('inicio',fim+'T23:59:59'),
    empFilter(sb.from('abastecimentos').select('veiculo_id,litros,valor_total,data')).gte('data',ini).lte('data',fim+'T23:59:59'),
    empFilter(sb.from('despesas').select('valor,categoria,data')).gte('data',ini).lte('data',fim+'T23:59:59'),
    empFilter(sb.from('recebimentos').select('valor,tipo,data')).gte('data',ini).lte('data',fim+'T23:59:59'),
    empFilter(sb.from('multas').select('valor,data_infracao')).gte('data_infracao',ini),
    empFilter(sb.from('despesas').select('valor,data')).eq('status','aguardando').gte('data',ini).lte('data',fim+'T23:59:59')
  ]);
  const J=jrn.data||[],A=abs.data||[],D=desp.data||[],R=rec.data||[],M=mlt.data||[],DP=despP.data||[];
  const meses=['Jun','Jul','Ago','Set','Out','Nov'];
  const mk=()=>{const m={};meses.forEach(x=>m[x]=0);return m};
  const mRec=mk(),mDesp=mk(),mLuc=mk(),mMult=mk(),mPend=mk();
  const idx=dt=>{const mm=(dt||'').slice(5,7);return meses[Number(mm)-6]||null};
  R.forEach(x=>{const k=idx(x.data);if(k){mRec[k]+=Number(x.valor);mLuc[k]+=Number(x.valor)}});
  D.forEach(x=>{const k=idx(x.data);if(k){mDesp[k]+=Number(x.valor);mLuc[k]-=Number(x.valor)}});
  M.forEach(x=>{const k=idx(x.data_infracao);if(k)mMult[k]+=Number(x.valor||0)});
  DP.forEach(x=>{const k=idx(x.data);if(k)mPend[k]+=Number(x.valor||0)});
  const fmtK=v=>v>=1000?(v/1000).toFixed(1).replace('.',',')+'k':Math.round(v);
  const acc=chartTheme().ok;
  const bar=(id,labels,s1,n1,s2,n2,c1,c2)=>{
    if(CHARTS[id])CHARTS[id].destroy();
    CHARTS[id]=new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[
      {label:n1,data:s1,backgroundColor:c1},{label:n2,data:s2,backgroundColor:c2}]},
      options:{responsive:true,plugins:{legend:{labels:{color:'#9a9a9a',font:{size:10}}}},
      scales:{x:{ticks:{color:'#9a9a9a',font:{size:9}}},y:{ticks:{color:'#9a9a9a',font:{size:9},callback:fmtK}}}}});
  };
  const bar1=(id,labels,vals,nome,cores)=>{
    if(CHARTS[id])CHARTS[id].destroy();
    CHARTS[id]=new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[{label:nome,data:vals,backgroundColor:cores||acc}]},
      options:{responsive:true,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#9a9a9a',font:{size:9}}},y:{ticks:{color:'#9a9a9a',font:{size:9},callback:fmtK}}}}});
  };
  const line1=(id,labels,vals,nome)=>{
    if(CHARTS[id])CHARTS[id].destroy();
    CHARTS[id]=new Chart(document.getElementById(id),{type:'line',data:{labels,datasets:[{label:nome,data:vals,borderColor:'#4a90d9',backgroundColor:'rgba(74,144,217,.12)',fill:true,tension:.3,pointRadius:3}]},
      options:{responsive:true,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#9a9a9a',font:{size:9}}},y:{ticks:{color:'#9a9a9a',font:{size:9}}}}}});
  };
  const donut=(id,labels,vals)=>{
    if(CHARTS[id])CHARTS[id].destroy();
    CHARTS[id]=new Chart(document.getElementById(id),{type:'doughnut',data:{labels,datasets:[{data:vals,backgroundColor:[acc,'#4a90d9','#3ecf6e','#e05252','#9a6ad9','#e0a052','#777'],borderColor:'#1a1a1a',borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#9a9a9a',font:{size:10},boxWidth:12}}}}});
  };
  // ---- abas ----
  const temDin=(e==='GRUPO'||e==='TRANSPORTADORA')&&(R.length||D.length);
  const temOpe=!!(J.length||A.length);
  const temCtl=!!(M.length||DP.length);
  const tabs=[temDin?['dinheiro','💰 Dinheiro']:null,temOpe?['operacao','🚚 Operação']:null,temCtl?['controle','📋 Controle']:null].filter(Boolean);
  if(!tabs.length){box.innerHTML=empty('Sem dados no período para gráficos');return}
  if(!window.__dbTab||!tabs.find(t=>t[0]===window.__dbTab))window.__dbTab=tabs[0][0];
  box.innerHTML=`<div class="dbtabs">${tabs.map(t=>`<button data-t="${t[0]}" class="${window.__dbTab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div><div id="db-tab-body"></div>`;
  box.querySelectorAll('.dbtabs button').forEach(b=>b.onclick=()=>{window.__dbTab=b.dataset.t;box.querySelectorAll('.dbtabs button').forEach(x=>x.classList.toggle('on',x===b));renderTab()});
  function renderTab(){
    const el=document.getElementById('db-tab-body');if(!el)return;
    Object.keys(CHARTS).forEach(k=>{try{CHARTS[k]&&CHARTS[k].destroy&&CHARTS[k].destroy()}catch(_){}delete CHARTS[k]});
    let html='';const t=window.__dbTab;
    if(t==='dinheiro'){
      html+=`<div class="sec"><h3>💰 Recebimentos × Despesas (6 meses)</h3><div style="height:210px"><canvas id="ch-recdesp"></canvas></div></div>`;
      html+=`<div class="sec"><h3>📈 Lucro por mês (recebeu − gastou)</h3><div style="height:190px"><canvas id="ch-lucro"></canvas></div></div>`;
      html+=`<div class="sec"><h3>🥧 Despesas por tipo (período)</h3><div style="height:230px"><canvas id="ch-tipo"></canvas></div></div>`;
      el.innerHTML=html;
      bar('ch-recdesp',meses,Object.values(mRec).map(x=>Math.round(x)),'Recebimentos',Object.values(mDesp).map(x=>Math.round(x)),'Despesas',acc,'#e05252');
      const luc=Object.values(mLuc).map(x=>Math.round(x));
      bar1('ch-lucro',meses,luc,'Lucro (R$)',luc.map(v=>v>=0?'#3ecf6e':'#e05252'));
      const porTipo={};D.forEach(x=>{const g=(x.categoria||'Outros').trim()||'Outros';porTipo[g]=(porTipo[g]||0)+Number(x.valor||0)});
      let ent=Object.entries(porTipo).sort((a,b)=>b[1]-a[1]);
      if(ent.length>6){ent=ent.slice(0,5).concat([['Outros',ent.slice(5).reduce((s,x)=>s+x[1],0)]])}
      donut('ch-tipo',ent.map(x=>x[0]),ent.map(x=>Math.round(x[1])));
    }
    if(t==='operacao'){
      html+=`<div class="sec"><h3>🛣️ Jornadas por dia (30 dias)</h3><div style="height:190px"><canvas id="ch-jordia"></canvas></div></div>`;
      html+=`<div class="sec"><h3>⛽ km/L por caminhão (período)</h3><div style="height:300px"><canvas id="ch-kml"></canvas></div></div>`;
      html+=`<div class="sec"><h3>📉 km/L da frota por mês</h3><div style="height:180px"><canvas id="ch-kmlmes"></canvas></div></div>`;
      el.innerHTML=html;
      const dias=[...new Set(J.map(x=>f(x.inicio)))].sort().slice(-30);
      if(dias.length){
        const cnt=dias.map(d=>J.filter(x=>f(x.inicio)===d).length);
        CHARTS.jd=new Chart(document.getElementById('ch-jordia'),{type:'line',data:{labels:dias.map(d=>d.slice(8,10)+'/'+d.slice(5,7)),datasets:[{label:'Jornadas',data:cnt,borderColor:acc,backgroundColor:'rgba(255,255,255,.06)',fill:true,tension:.3,pointRadius:2}]},
          options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9a9a9a',font:{size:8},maxRotation:0,autoSkip:true,maxTicksLimit:10}},y:{ticks:{color:'#9a9a9a',font:{size:9}}}}}});
      }
      (async()=>{
        const porV={};
        A.forEach(a=>{const g=porV[a.veiculo_id]=porV[a.veiculo_id]||{L:0,km:0};g.L+=Number(a.litros||0)});
        J.filter(x=>x.km_final!=null).forEach(x=>{if(porV[x.veiculo_id])porV[x.veiculo_id].km+=Number(x.km_final)-Number(x.km_inicial)});
        const ids=Object.keys(porV);
        if(!ids.length)return;
        const vs2=await sb.from('veiculos').select('id,placa').in('id',ids);
        const placa={};(vs2.data||[]).forEach(x=>placa[x.id]=x.placa);
        const rows=ids.map(id=>({p:placa[id]||'?',kml:porV[id].L>0?porV[id].km/porV[id].L:0})).filter(r=>r.kml>0.1);
        rows.sort((a,b)=>b.kml-a.kml);
        if(document.getElementById('ch-kml')){
          if(CHARTS.kml)CHARTS.kml.destroy();
          CHARTS.kml=new Chart(document.getElementById('ch-kml'),{type:'bar',data:{labels:rows.map(r=>r.p),datasets:[{label:'km/L',data:rows.map(r=>r.kml),backgroundColor:acc}]},
            options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9a9a9a',font:{size:9}}},y:{ticks:{color:'#9a9a9a',font:{size:9}}}}}});
        }
        const mL=mk(),mKm=mk();
        A.forEach(a=>{const k=idx(a.data);if(k)mL[k]+=Number(a.litros||0)});
        J.filter(x=>x.km_final!=null).forEach(x=>{const k=idx(x.inicio);if(k)mKm[k]+=Number(x.km_final)-Number(x.km_inicial)});
        const kmlM=meses.map(m=>mL[m]>0?Math.round(mKm[m]/mL[m]*10)/10:0);
        if(document.getElementById('ch-kmlmes')){
          if(kmlM.some(v=>v>0))line1('ch-kmlmes',meses,kmlM,'km/L');
          else document.getElementById('ch-kmlmes').closest('.sec').innerHTML='<p class="hint">Sem abastecimentos suficientes para o km/L mensal.</p>';
        }
      })();
    }
    if(t==='controle'){
      html+=`<div class="sec"><h3>🚨 Multas por mês (R$)</h3><div style="height:190px"><canvas id="ch-mult"></canvas></div></div>`;
      html+=`<div class="sec"><h3>⏳ Reembolsos aguardando aprovação (R$/mês)</h3><div style="height:190px"><canvas id="ch-pend"></canvas></div></div>`;
      el.innerHTML=html;
      bar1('ch-mult',meses,Object.values(mMult).map(x=>Math.round(x)),'Multas (R$)','#e05252');
      bar1('ch-pend',meses,Object.values(mPend).map(x=>Math.round(x)),'Pendente (R$)','#e0a052');
    }
  }
  renderTab();
}
PAGES.relatorios=async el=>{
  el.innerHTML=`<h1 class="pg">Relatórios</h1><div id="rel">${empty('Carregando…')}</div>`;

    empFilter(sb.from('despesas').select('motorista_id,categoria,valor,data')).gte('data',ini).lte('data',fim+'T23:59:59'),
    empFilter(sb.from('multas').select('motorista_id,valor,data_infracao')).gte('data_infracao',ini)

  const acc=chartTheme().ok;
  const meses=['Jun','Jul','Ago','Set','Out','Nov'];
  const idx=dt=>{const mm=(dt||'').slice(5,7);return meses[Number(mm)-6]||null};
  const mk=()=>{const m={};meses.forEach(x=>m[x]=0);return m};
  const mComb=mk(),mDesp=mk();
  A.forEach(x=>{const k=idx(x.data);if(k)mComb[k]+=Number(x.valor_total||0)});
  D.forEach(x=>{const k=idx(x.data);if(k)mDesp[k]+=Number(x.valor||0)});
  // ---- postos ----
  const postos={};
  A.forEach(x=>{const pn=(x.posto||'—').trim()||'—';const g=postos[pn]=postos[pn]||{n:0,L:0,R:0};g.n++;g.L+=Number(x.litros||0);g.R+=Number(x.valor_total||0)});
  const pTop=Object.entries(postos).sort((a,b)=>b[1].R-a[1].R);
  // ---- categorias ----
  const cats={};
  D.forEach(x=>{const c=(x.categoria||'Outros').trim()||'Outros';cats[c]=(cats[c]||0)+Number(x.valor||0)});
  const cTop=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const ehManut=c=>/pe[cç]a|pneu|manuten|borrachari|mec[aâ]nic|[óo]leo|oficina/i.test(c||'');
  // ---- motoristas ----
  const mot={};
  M.forEach(m=>mot[m.id]={nome:m.nome,nJ:0,km:0,L:0,comb:0,manut:0,outras:0,multas:0,vMultas:0});
  J.forEach(x=>{const g=mot[x.motorista_id];if(!g)return;g.nJ++;if(x.km_final!=null)g.km+=Number(x.km_final)-Number(x.km_inicial)});
  A.forEach(x=>{const g=mot[x.motorista_id];if(!g)return;g.L+=Number(x.litros||0);g.comb+=Number(x.valor_total||0)});
  D.forEach(x=>{const g=mot[x.motorista_id];if(!g)return;if(ehManut(x.categoria))g.manut+=Number(x.valor||0);else g.outras+=Number(x.valor||0)});
  X.forEach(x=>{const g=mot[x.motorista_id];if(!g)return;g.multas++;g.vMultas+=Number(x.valor||0)});
  Object.values(mot).forEach(g=>{g.total=g.comb+g.manut+g.outras+g.vMultas;g.kml=g.L>0?g.km/g.L:0});
  let rows=Object.values(mot).filter(g=>g.nJ||g.comb||g.manut||g.outras||g.multas);
  // ---- abas ----
  const tabs=[['gastos','💰 Gastos'],['motoristas','🧑‍✈️ Motoristas']];
  if(!window.__relTab)window.__relTab='gastos';
  const destr=()=>{Object.keys(CHARTS).forEach(k=>{if(k.startsWith('rel')){try{CHARTS[k].destroy()}catch(_){}delete CHARTS[k]}})};
  function renderTab(){
    destr();

    box.innerHTML=html;

        <div class="kpi"><div class="v">${fmtBRL(tComb)}</div><div class="l">⛽ Combustível</div></div>

      </div>
      <div class="sec"><h3>📅 Gasto por mês — combustível × despesas</h3><div style="height:210px"><canvas id="rel-mes"></canvas></div></div>
      <div class="sec"><h3>🏪 Postos — quanto abasteceu em cada um</h3>
        ${pTop.length?`<p class="hint">🏆 O posto que mais abastece: <b>${esc(pTop[0][0])}</b> — ${pTop[0][1].n} abastecimentos · ${fmtBRL(pTop[0][1].R)} · ${Math.round(pTop[0][1].L).toLocaleString('pt-BR')} L</p><div style="height:${Math.min(pTop.length,8)*34+40}px"><canvas id="rel-postos"></canvas></div>`:`<p class="hint">Sem abastecimentos no período.</p>`}
      </div>
      <div class="sec"><h3>🥧 Despesas por tipo</h3>${cTop.length?`<div style="height:230px"><canvas id="rel-cats"></canvas></div>`:`<p class="hint">Sem despesas no período.</p>`}</div>`;
      if(CHARTS['rel-mes'])CHARTS['rel-mes'].destroy();
      CHARTS['rel-mes']=new Chart(document.getElementById('rel-mes'),{type:'bar',data:{labels:meses,datasets:[
        {label:'⛽ Combustível',data:meses.map(m=>Math.round(mComb[m])),backgroundColor:acc},
        {label:'🔧 Despesas',data:meses.map(m=>Math.round(mDesp[m])),backgroundColor:'#4a90d9'}]},
        options:{responsive:true,plugins:{legend:{labels:{color:'#9a9a9a',font:{size:10}}}},scales:{x:{ticks:{color:'#9a9a9a',font:{size:9}}},y:{ticks:{color:'#9a9a9a',font:{size:9},callback:fmtK}}}}});
      if(pTop.length){
        const top=pTop.slice(0,8);
        CHARTS['rel-postos']=new Chart(document.getElementById('rel-postos'),{type:'bar',data:{labels:top.map(x=>x[0]),datasets:[{label:'R$ abastecidos',data:top.map(x=>Math.round(x[1].R)),backgroundColor:acc}]},
          options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#9a9a9a',font:{size:9},callback:fmtK}},y:{ticks:{color:'#9a9a9a',font:{size:9}}}}}});
      }
      if(cTop.length){
        let ent=cTop.slice(0,6);
        if(cTop.length>6)ent=ent.slice(0,5).concat([['Outros',cTop.slice(5).reduce((s,x)=>s+x[1],0)]]);
        CHARTS['rel-cats']=new Chart(document.getElementById('rel-cats'),{type:'doughnut',data:{labels:ent.map(x=>x[0]),datasets:[{data:ent.map(x=>Math.round(x[1])),backgroundColor:[acc,'#4a90d9','#3ecf6e','#e05252','#9a6ad9','#e0a052'],borderColor:'#1a1a1a',borderWidth:2}]},
          options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#9a9a9a',font:{size:10},boxWidth:12}}}}});
      }
    }
    if(t==='motoristas'){
      const ordenar={km:(a,b)=>b.km-a.km,manut:(a,b)=>b.manut-a.manut,total:(a,b)=>b.total-a.total};
      if(!window.__relSort)window.__relSort='km';
      rows.sort(ordenar[window.__relSort]);
      el.innerHTML=`<div class="dbtabs" style="margin-top:0">
        <button data-s="km" class="${window.__relSort==='km'?'on':''}">🛣️ Mais rodou</button>
        <button data-s="manut" class="${window.__relSort==='manut'?'on':''}">🔧 Mais gastou manutenção</button>
        <button data-s="total" class="${window.__relSort==='total'?'on':''}">💰 Maior gasto total</button>
      </div>
      <div class="sec"><div class="tblwrap"><table><tr><th>Motorista</th><th>Jorn.</th><th>Km</th><th>km/L</th><th>⛽ R$</th><th>🔧 Manut. R$</th><th>Outros R$</th><th>🚨 Multas</th><th>TOTAL R$</th></tr>
      ${rows.map((g,i)=>`<tr${i===0?' style="background:rgba(252,200,92,.08)"':''}><td><b>${esc(g.nome)}</b></td><td>${g.nJ}</td><td>${Math.round(g.km).toLocaleString('pt-BR')}</td><td>${g.kml?g.kml.toFixed(1).replace('.',','):'—'}</td><td>${Math.round(g.comb).toLocaleString('pt-BR')}</td><td>${Math.round(g.manut).toLocaleString('pt-BR')}</td><td>${Math.round(g.outras).toLocaleString('pt-BR')}</td><td>${g.multas?g.multas+' × '+Math.round(g.vMultas).toLocaleString('pt-BR'):'—'}</td><td><b>${Math.round(g.total).toLocaleString('pt-BR')}</b></td></tr>`).join('')}

      el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{window.__relSort=b.dataset.s;renderTab()});
    }
  }
  renderTab();
};

  const crlvBy={};(docs||[]).forEach(d=>{if(!crlvBy[d.veiculo_id])crlvBy[d.veiculo_id]=d});
  l.innerHTML=`<div class="tblwrap"><table><tr><th>Placa</th><th>Marca/Modelo</th><th>Ano</th><th>RENAVAM</th><th>Óleo (km)</th><th>CRLV-e</th><th>Status</th><th></th></tr>
  ${lista.map(v=>{const d=crlvBy[v.id];const venc=d?.vencimento&&d.vencimento<hoje();return `<tr><td><b>${esc(v.placa)}</b></td><td>${esc(v.marca||'')} ${esc(v.modelo||'')}</td><td>${v.ano||'—'}</td><td>${esc(v.renavam||'—')}</td><td>${v.intervalo_oleo_km?km(v.intervalo_oleo_km):'—'}</td>
  <td>${d?`<button class="btn mini" data-dc="${d.arquivo_path}">Abrir</button> <button class="btn mini" data-dl="${d.arquivo_path}" data-pl="${esc(v.placa)}">⬇️ Baixar</button>${d.vencimento?`<div class="hint" style="${venc?'color:var(--bad)':''}">venc. ${fmtD(d.vencimento)}${venc?' ⚠️':''}</div>`:''}`:'<span class="tag reprovada">faltando</span>'}</td>
  <td>${v.ativo?'<span class="tag fechada">ativo</span>':'<span class="tag arquivado">inativo</span>'}</td>

    const url=await assinar(b.dataset.dc,'documentos');

    try{
      const resp=await fetch(url);const blob=await resp.blob();
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download='CRLV-e '+(b.dataset.pl||'veiculo')+'.pdf';
      document.body.appendChild(a);a.click();a.remove();
      toast('Download iniciado');
    }catch(_){window.open(url,'_blank')}

      const file=inp.files[0];if(!file)return;
      const ext=(file.name.split('.').pop()||'pdf').toLowerCase();

      openModal('📄 Vencimento do CRLV-e',[
        {id:'crlv-venc',label:'Vencimento (opcional — deixe vazio se não souber)',tipo:'date',valor:''}
      ],async v=>{
        const r=await ins('veiculos_documentos',insEmp({veiculo_id:vid,tipo:'CRLV-e',arquivo_path:path,vencimento:v['crlv-venc']||null,enviado_por:ME.id}));
        if(r){toast('CRLV-e atualizado');go('veiculos')}
      });
    };
    inp.click();
  });
};
PAGES.motoristas=async el=>{

    const w=document.getElementById('modal-wrap'),m=document.getElementById('modal');
    m.innerHTML=`<h3>🚚 Veículos do motorista</h3><p class="hint" style="margin:0 0 8px">Toque para marcar/desmarcar. Pode deixar vários — o caminhão em viagem fica bloqueado sozinho.</p>`+
      campos.map(f=>`<label style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #242424;cursor:pointer"><input type="checkbox" id="${f.id}" ${f.valor?'checked':''} style="width:18px;height:18px;accent-color:var(--acc)"><span style="font-size:13px">${esc(f.label)}</span></label>`).join('')+

      {id:'ed-cont',label:'Contato (WhatsApp)',valor:m.contato||'',placeholder:'(19) 99999-9999',inputmode:'tel'},
    ],async v=>{
      const sit=(v['ed-cpf']&&v['ed-cnh']&&v['ed-val'])?'completo':'incompleto';
      return await upd('motoristas',m.id,{cpf:v['ed-cpf']||null,cnh:v['ed-cnh']||null,cnh_categoria:v['ed-cat']||null,cnh_validade:v['ed-val']||null,contato:v['ed-cont']||null,situacao:sit})?(go('motoristas'),true):false;
    });

  // ===== painel do mecânico: KPIs, gráficos, óleo e avisos =====
  if(ME.perfil==='mecanico'){

    // óleo por veículo

      return {...v, falta};
    }).filter(v=>v.falta!=null).sort((a,b)=>b.falta-a.falta);

    const maxV=topVeic.length?topVeic[0][1]:1;
    pn.innerHTML=`<div class="kpis">

    ${proximos.length?`<div class="sec"><h3>🛢️ Óleo — próximas trocas</h3>
      ${proximos.map(v=>`<div style="display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #242424;font-size:13px"><b>${esc(v.placa)}</b> ${esc(v.modelo||'')}<span>próxima em ${km(-v.falta)}</span></div>`).join('')}</div>`:''}
    ${avs&&avs.length?`<div class="sec"><h3>📣 Avisos encaminhados para você (${avs.length})</h3>
      ${avs.map(a=>`<div style="padding:9px 4px;border-bottom:1px solid #242424;font-size:13px"><b>${esc(a.veiculos?.placa||'')}</b> · ${esc(a.categoria||'')} · ${esc(a.motoristas?.nome||'')}<div class="hint">${esc(a.texto)}</div></div>`).join('')}</div>`:''}
    <div class="sec"><h3>OS em aberto por veículo</h3>
      ${topVeic.length?topVeic.map(([p,n])=>`

  }

  const FLOW={recebida:'em_analise',em_analise:'aguardando_peca',aguardando_peca:'em_execucao',em_execucao:'concluida'};
  const LBL={recebida:'▶ Iniciar análise',em_analise:'⏳ Aguardando peça',aguardando_peca:'🔨 Em execução',em_execucao:'✓ Concluir'};

      {id:'os-custos',label:'Outros custos (R$)',tipo:'number',valor:o.custos||''},

function haversine(a,b,c,d){const R=6371,t=Math.PI/180,dl=(c-a)*t,dg=(d-b)*t,x=Math.sin(dl/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

async function novaRotaUI(){
  const st={clientes:new Set(),nfs:{},seq:[]};
  const [{data:mots},{data:veics},{data:cls},{data:nfs}]=await Promise.all([
    sb.from('motoristas').select('id,nome').eq('ativo',true).order('nome'),
    sb.from('veiculos').select('id,placa,modelo').eq('ativo',true).order('placa'),
    sb.from('clientes_dist').select('id,nome,cidade,lat,lng').eq('ativo',true).order('nome'),
    sb.from('notas_fiscais').select('id,numero,cliente_id,vendedor,comprador').order('numero')]);
  $('main').innerHTML=`<button class="btn sec" id="nr-volt">← Voltar</button><h1 class="pg">Nova rota</h1>
  <div class="sec"><label>Data da operação</label><input id="nr-data" type="date" value="${hoje()}">
  <label>Motorista</label><select id="nr-mot">${opt((mots||[]).map(m=>[m.id,m.nome]),null)}</select>
  <label>Veículo (todos os caminhões do grupo)</label><select id="nr-veic">${opt((veics||[]).map(v=>[v.id,(v.placa||'')+' — '+(v.modelo||'')]),null)}</select></div>
  <div class="sec"><h3>1 · Clientes da rota</h3><input id="nr-busca" placeholder="🔎 buscar cliente"><div id="nr-cls" style="max-height:300px;overflow:auto;margin-top:8px"></div></div>
  <div class="sec"><h3>2 · Notas fiscais</h3><div id="nr-nfs"><p class="hint">Selecione os clientes acima — depois toque em “+ NF” para lançar a nota de cada um (nº, vendedor, comprador).</p></div></div>
  <div class="sec" id="nr-seq-sec" style="display:none"><h3>3 · Sequência de visitas</h3>
  <p class="hint">Sugestão por distância (vizinho mais próximo) — ajuste com ▲▼</p>
  <button class="btn sec" id="nr-otim">⚡ Otimizar sequência</button><div id="nr-seq" style="margin-top:8px"></div>
  <button class="btn" id="nr-salvar" style="margin-top:12px">💾 Salvar e distribuir ao motorista</button><div class="msg" id="nr-msg"></div></div>`;
  $('nr-volt').onclick=()=>go('rotas');
  const renderCls=q=>{
    const f=(cls||[]).filter(c=>!q||(c.nome+' '+(c.cidade||'')).toLowerCase().includes(q.toLowerCase()));
    $('nr-cls').innerHTML=f.map(c=>`<label style="display:flex;align-items:center;gap:10px;padding:8px;background:var(--field);border:1px solid #333;border-radius:10px;margin-bottom:6px;cursor:pointer"><input type="checkbox" data-cid="${c.id}" ${st.clientes.has(c.id)?'checked':''} style="width:18px;height:18px;accent-color:var(--acc)"><span style="flex:1;font-size:13px"><b>${esc(c.nome)}</b><br><span class="hint">${esc(c.cidade||'—')}${c.lat?' · 📍':''}</span></span></label>`).join('')||empty('Nenhum cliente');
    $('nr-cls').querySelectorAll('[data-cid]').forEach(ch=>ch.onchange=()=>{ch.checked?st.clientes.add(ch.dataset.cid):st.clientes.delete(ch.dataset.cid);renderNfs();renderSeq()});
  };
  $('nr-busca').oninput=()=>renderCls($('nr-busca').value);
  const renderNfs=()=>{
    if(!st.clientes.size){$('nr-nfs').innerHTML=`<p class="hint">Selecione os clientes acima.</p>`;return}
    $('nr-nfs').innerHTML=[...st.clientes].map(cid=>{
      const c=cls.find(x=>x.id===cid);const minhas=(nfs||[]).filter(n=>n.cliente_id===cid);
      return `<div style="padding:8px;background:var(--field);border:1px solid #333;border-radius:10px;margin-bottom:6px"><b style="font-size:13px">${esc(c.nome)}</b>
      ${minhas.length?minhas.map(n=>`<p class="hint">NF ${esc(n.numero)} · ${esc(n.vendedor||'—')}${n.comprador?' · '+esc(n.comprador):''} <button class="btn mini" data-delnf="${n.id}">🗑</button></p>`).join(''):'<p class="hint">sem NF lançada</p>'}
      <button class="btn mini" data-addnf="${cid}" style="margin-top:4px">➕ NF</button></div>`}).join('');
    $('nr-nfs').querySelectorAll('[data-addnf]').forEach(b=>b.onclick=()=>{
      const c=cls.find(x=>x.id===b.dataset.addnf);
      openModal('NF — '+c.nome,[{id:'nf-num',label:'Nº da NF *'},{id:'nf-vend',label:'Vendedor'},{id:'nf-comp',label:'Comprador'}],async v=>{
        if(!v['nf-num'].trim()){toast('Informe o número');return false}
        const {data:nv,error}=await sb.from('notas_fiscais').insert({numero:v['nf-num'].trim(),cliente_id:c.id,vendedor:v['nf-vend'].trim()||null,comprador:v['nf-comp'].trim()||null}).select().single();
        if(error){toast(err(error));return false}
        nfs.push(nv);toast('NF lançada');renderNfs();return true;
      });
    });
    $('nr-nfs').querySelectorAll('[data-delnf]').forEach(b=>b.onclick=async()=>{await sb.from('notas_fiscais').delete().eq('id',b.dataset.delnf);const i=nfs.findIndex(n=>n.id===b.dataset.delnf);if(i>=0)nfs.splice(i,1);renderNfs()});
  };
  const renderSeq=()=>{
    st.seq=[...st.clientes];
    const sec=$('nr-seq-sec');
    if(!st.clientes.size){sec.style.display='none';return}
    sec.style.display='';
    const linha=()=>{
      $('nr-seq').innerHTML=st.seq.map((cid,i)=>{
        const c=cls.find(x=>x.id===cid);
        return `<div style="display:flex;align-items:center;gap:8px;padding:7px;background:var(--field);border:1px solid #333;border-radius:10px;margin-bottom:5px"><b style="width:22px;color:var(--acc)">${i+1}</b><span style="flex:1;font-size:13px">${esc(c.nome)}</span><button class="btn mini" data-up="${i}" ${i===0?'disabled':''}>▲</button><button class="btn mini" data-dn="${i}" ${i===st.seq.length-1?'disabled':''}>▼</button></div>`}).join('');
      $('nr-seq').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[st.seq[i-1],st.seq[i]]=[st.seq[i],st.seq[i-1]];linha()});
      $('nr-seq').querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;[st.seq[i+1],st.seq[i]]=[st.seq[i],st.seq[i+1]];linha()});
    };
    $('nr-otim').onclick=()=>{
      const pts=st.seq.map(cid=>cls.find(x=>x.id===cid));
      const comGps=pts.filter(p=>p.lat&&p.lng),sem=pts.filter(p=>!(p.lat&&p.lng));
      const ord=[];let atual=comGps.shift();if(atual)ord.push(atual);
      while(comGps.length){
        let bi=0,bd=1e9;
        comGps.forEach((p,i)=>{const d=haversine(atual.lat,atual.lng,p.lat,p.lng);if(d<bd){bd=d;bi=i}});
        atual=comGps.splice(bi,1)[0];ord.push(atual);
      }
      st.seq=ord.concat(sem).map(p=>p.id);linha();
      toast('Sequência otimizada por distância');
    };
    linha();
  };
  $('nr-salvar').onclick=async()=>{
    if(!st.clientes.size){toast('Selecione ao menos um cliente');return}
    const mot=$('nr-mot').value,veic=$('nr-veic').value;
    if(!mot||!veic){toast('Escolha motorista e veículo');return}
    const seq=st.seq.map((cid,i)=>({ordem:i+1,cliente_id:cid}));
    const {data:rota,error}=await sb.from('rotas').insert({data:$('nr-data').value||hoje(),motorista_id:mot,veiculo_id:veic,status:'distribuida',sequencia:seq}).select().single();
    if(error){$('nr-msg').className='msg err';$('nr-msg').textContent=err(error);return}
    const rows=st.seq.map((cid,i)=>{
      const minhas=(nfs||[]).filter(n=>n.cliente_id===cid);
      const extra=minhas.slice(1).map(n=>n.id);
      return {rota_id:rota.id,ordem:i+1,cliente_id:cid,nf_id:minhas.length?minhas[0].id:null,nfs_extra:extra,status:'pendente'};
    });
    const {error:e2}=await sb.from('entregas').insert(rows);
    if(e2){toast('Rota criada, mas entregas falharam: '+err(e2));return}
    toast('Rota distribuída ao motorista ✅');go('rotas');
  };
  renderCls('');renderNfs();renderSeq();
}

async function pagRotaDetalhe(id){
  const {data:r}=await sb.from('rotas').select('*, motoristas(nome), veiculos(placa,modelo)').eq('id',id).maybeSingle();
  if(!r){toast('Rota não encontrada');return}
  const {data:ents}=await sb.from('entregas').select('*, clientes_dist(nome,endereco,cidade,uf,lat,lng), notas_fiscais(numero,vendedor,comprador)').eq('rota_id',id).order('ordem');
  let html=`<button class="btn sec" id="rd-volt">← Voltar</button><h1 class="pg">Rota ${fmtD(r.data)}</h1>
  <div class="sec"><b>${esc(r.motoristas?.nome||'—')}</b> · ${esc(r.veiculos?.placa||'—')} <span class="tag">${r.status}</span>
  ${r.km_inicial!=null?`<p class="hint">Km ${fmtKm(r.km_inicial)}${r.km_final!=null?' → '+fmtKm(r.km_final)+' · percorrido '+fmtKm(Number(r.km_final)-Number(r.km_inicial)):''}</p>`:''}</div>
  <div class="sec"><h3>Entregas (${(ents||[]).length})</h3>`+((ents||[]).map(e=>{

    return `<div style="padding:10px;background:var(--field);border:1px solid #333;border-radius:10px;margin-bottom:6px"><b>${e.ordem}. ${esc(e.clientes_dist?.nome||'—')}</b> <span class="tag ${st}">${e.status.replace('_',' ')}</span>
    <p class="hint">NF ${esc(e.notas_fiscais?.numero||'—')}${nfx?' +'+nfx+' NF':''} · vendedor ${esc(e.notas_fiscais?.vendedor||'—')}${e.notas_fiscais?.comprador?' · comprador '+esc(e.notas_fiscais.comprador):''}</p>
    ${e.motivo?`<p class="hint" style="color:var(--bad)">Motivo: ${esc(e.motivo)}</p>`:''}
    ${e.foto_path?`<div id="rd-foto-${e.id}">${empty('comprovante…')}</div>`:''}</div>`}).join('')||empty(''))+`</div>`;
  if(ME.perfil==='gerencia'&&r.status!=='encerrada')html+=`<div class="sec"><button class="btn" id="rd-enc">✅ Encerrar rota</button></div>`;
  $('main').innerHTML=html;
  $('rd-volt').onclick=()=>go('rotas');
  for(const e of (ents||[]).filter(x=>x.foto_path)){const d=$('rd-foto-'+e.id);if(d)d.innerHTML=await fotoHtml(e.foto_path)}
  const enc=$('rd-enc');if(enc)enc.onclick=async()=>{await upd('rotas',id,{status:'encerrada',fim:new Date().toISOString()});toast('Rota encerrada');pagRotaDetalhe(id)};
}
